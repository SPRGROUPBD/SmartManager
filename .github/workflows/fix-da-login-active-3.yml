name: Fix DA active login 3
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('userbill.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('\\nfunction isUserActiveForLogin')
          end=s.find('\\n// ========== LOGIN ==========', start)
          if start < 0 or end < 0:
              raise SystemExit('login patch block not found')
          nl=chr(10)
          block=nl+"function isUserActiveForLogin(u){"+nl+"    return !!u && u.active!==false && u.deactivated!==true;"+nl+"}"+nl+"function blockIfDeactivatedUser(){"+nl+"    if(currentUser && currentUser.role==='user' && !isUserActiveForLogin(currentUser)){"+nl+"        alert('এই DA ID Deactive করা হয়েছে। নতুন Bill/Entry দেওয়া যাবে না।');"+nl+"        return true;"+nl+"    }"+nl+"    return false;"+nl+"}"+nl+"function startDAStatusWatcher(){"+nl+"    if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}"+nl+"    if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;"+nl+"    window.__daStatusWatcher=database.ref('Users/'+currentUser.id);"+nl+"    window.__daStatusWatcher.on('value',function(snap){"+nl+"        if(!snap.exists()) return;"+nl+"        var u=snap.val(),active=isUserActiveForLogin(u);"+nl+"        currentUser.active=active;"+nl+"        currentUser.status=active?'active':'deactivated';"+nl+"        if(!active){"+nl+"            localStorage.removeItem('auth_user');"+nl+"            if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}"+nl+"            currentUser=null;"+nl+"            document.getElementById('dashboard_section').classList.add('hidden');"+nl+"            document.getElementById('login_section').classList.remove('hidden');"+nl+"            resetLoginUI();"+nl+"            setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');"+nl+"            alert('এই DA ID Deactive করা হয়েছে। Login/নতুন Bill/Entry বন্ধ।');"+nl+"        }else{"+nl+"            localStorage.setItem('auth_user',JSON.stringify(currentUser));"+nl+"        }"+nl+"    });"+nl+"}"+nl+"function validateSavedDA(){"+nl+"    if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;"+nl+"    database.ref('Users/'+currentUser.id).once('value',function(s){"+nl+"        if(!s.exists()) return;"+nl+"        if(!isUserActiveForLogin(s.val())){"+nl+"            localStorage.removeItem('auth_user');"+nl+"            currentUser=null;"+nl+"            document.getElementById('dashboard_section').classList.add('hidden');"+nl+"            document.getElementById('login_section').classList.remove('hidden');"+nl+"            resetLoginUI();"+nl+"            setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');"+nl+"        }else{"+nl+"            startDAStatusWatcher();"+nl+"            showDashboard();"+nl+"        }"+nl+"    });"+nl+"}"+nl
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userbill.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix active DA login'
          git push
