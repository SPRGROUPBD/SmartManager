name: Fix DA active login
on:
  push:
    paths:
      - '.github/workflows/fix-da-login-active.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userbill login guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('userbill.html')
          s=p.read_text(encoding='utf-8')
          old="""function isUserActiveForLogin(u){\n    return !!u && !(u.active===false || u.status==='inactive' || u.status==='deactivated' || u.deactivated===true);\n}"""
          new="""function isUserActiveForLogin(u){\n    // Only explicit deactivation flags can block a DA. Missing/legacy status fields must not block active users.\n    return !!u && u.active!==false && u.deactivated!==true;\n}"""
          if old not in s:
              raise SystemExit('helper block not found')
          s=s.replace(old,new,1)
          old2="""        var u=snap.val(),active=isUserActiveForLogin(u);\n        currentUser.active=active;\n        currentUser.status=active?'active':'deactivated';\n        if(!active){"""
          new2="""        if(!snap.exists()) return;\n        var u=snap.val(),active=isUserActiveForLogin(u);\n        currentUser.active=active;\n        currentUser.status=active?'active':'deactivated';\n        if(!active){"""
          if old2 not in s:
              raise SystemExit('watcher block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userbill.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix active DA login guard'
          git push
