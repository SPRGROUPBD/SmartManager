<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Refreshes the page every 5 seconds -->
   <meta http-equiv="refresh" content="0">
    <title>Page Auto Refresh</title>
</head>
<body>
    <h1>This page will refresh every 5 seconds.</h1>
    <script>
    // কোনো সময় বা ডিলে ছাড়াই পেজ রিফ্রেশ করবে
    location.reload();
</script>
</body>
</html>
