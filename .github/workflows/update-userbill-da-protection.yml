name: Update userbill DA protection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update userbill.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('userbill.html')
          s=p.read_text(encoding='utf-8')
          original=s

          helper="""
function isCurrentUserActive(){
    return !(currentUser && (currentUser.active===false || currentUser.status==='inactive' || currentUser.status==='deactivated' || currentUser.deactivated===true));
}
function blockIfDeactivatedUser(){
    if(currentUser && currentUser.role==='user' && !isCurrentUserActive()){
        alert('এই DA ID Deactive করা হয়েছে। নতুন Bill/Entry দেওয়া যাবে না।');
        return true;
    }
    return false;
}
function validateCurrentUserStatus(callback){
    if(!currentUser || currentUser.role!=='user' || !currentUser.id){ if(callback) callback(true); return; }
    database.ref('Users/'+currentUser.id).once('value',function(snap){
        var u=snap.val();
        var active=!!u && !(u.active===false || u.status==='inactive' || u.status==='deactivated' || u.deactivated===true);
        currentUser.active=active;
        currentUser.status=active?'active':'deactivated';
        if(!active){ localStorage.removeItem('auth_user'); if(typeof showLogin==='function') showLogin(); alert('এই DA ID Deactive করা হয়েছে। Login/নতুন Entry বন্ধ।'); }
        else localStorage.setItem('auth_user',JSON.stringify(currentUser));
        if(callback) callback(active);
    });
}
"""
          if 'function blockIfDeactivatedUser()' not in s:
              marker='</script>'
              pos=s.rfind(marker)
              if pos<0: raise SystemExit('script closing tag not found')
              s=s[:pos]+helper+'\n'+s[pos:]

          # Add guard to common bill-save/submit functions if present.
          funcs=['submitOrUpdateBill','saveBill','submitBill','saveAndSubmitBill']
          added=0
          for fn in funcs:
              pat=r'(function\s+'+re.escape(fn)+r'\s*\([^)]*\)\s*\{)'
              m=re.search(pat,s)
              if m:
                  start=m.end()
                  if 'blockIfDeactivatedUser()' not in s[start:start+500]:
                      s=s[:start]+"\n    if(blockIfDeactivatedUser()) return;"+s[start:]
                      added+=1

          # Restore/mark cached session with active status and revalidate on load.
          old="currentUser = JSON.parse(savedUser);\n            showDashboard();"
          if old in s:
              s=s.replace(old,"currentUser = JSON.parse(savedUser);\n            if(currentUser.role==='user') validateCurrentUserStatus(function(active){ if(active) showDashboard(); }); else showDashboard();",1)
          else:
              old2="currentUser=JSON.parse(savedUser);"
              if old2 in s and 'validateCurrentUserStatus(function(active)' not in s:
                  s=s.replace(old2,"currentUser=JSON.parse(savedUser); if(currentUser.role==='user') validateCurrentUserStatus(function(active){ if(active) showDashboard(); });",1)

          # If login code sets currentUser, copy active/status from the looked-up User record.
          pat=r"(currentUser\s*=\s*\{[^\n]*?id\s*:\s*lookedUpUser\.key[^\n]*?\};)"
          m=re.search(pat,s)
          if m and 'active:' not in m.group(1):
              oldcur=m.group(1)
              newcur=oldcur[:-2]+",active:isUserActiveForLogin(d),status:isUserActiveForLogin(d)?'active':'deactivated'};"
              # Add local helper if needed; avoid depending on exact helper name elsewhere.
              if 'function isUserActiveForLogin' not in s:
                  marker='function isCurrentUserActive(){'
                  s=s.replace(marker,"function isUserActiveForLogin(u){ return !!u && !(u.active===false || u.status==='inactive' || u.status==='deactivated' || u.deactivated===true); }\n"+marker,1)
              s=s.replace(oldcur,newcur,1)

          if s==original: raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userbill.html
          git diff --cached --quiet || git commit -m "Block deactivated DA from user bill entry"
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/update-userbill-da-protection.yml
          git commit -m "Remove temporary userbill patch workflow"
          git push
