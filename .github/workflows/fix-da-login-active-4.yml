name: Fix DA active login 4
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('userbill.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('function isUserActiveForLogin')
          end=s.find('// ========== LOGIN ==========', start)
          if start < 0 or end < 0:
              raise SystemExit('login helper not found')
          block="""function isUserActiveForLogin(u){
              return !!u && u.active!==false && u.deactivated!==true;
          }
          function blockIfDeactivatedUser(){
              if(currentUser && currentUser.role==='user' && !isUserActiveForLogin(currentUser)){
                  alert('এই DA ID Deactive করা হয়েছে। নতুন Bill/Entry দেওয়া যাবে না।');
                  return true;
              }
              return false;
          }
          function startDAStatusWatcher(){
              if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}
              if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;
              window.__daStatusWatcher=database.ref('Users/'+currentUser.id);
              window.__daStatusWatcher.on('value',function(snap){
                  if(!snap.exists()) return;
                  var u=snap.val(),active=isUserActiveForLogin(u);
                  currentUser.active=active;
                  currentUser.status=active?'active':'deactivated';
                  if(!active){
                      localStorage.removeItem('auth_user');
                      if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}
                      currentUser=null;
                      document.getElementById('dashboard_section').classList.add('hidden');
                      document.getElementById('login_section').classList.remove('hidden');
                      resetLoginUI();
                      setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');
                      alert('এই DA ID Deactive করা হয়েছে। Login/নতুন Bill/Entry বন্ধ।');
                  }else{
                      localStorage.setItem('auth_user',JSON.stringify(currentUser));
                  }
              });
          }
          function validateSavedDA(){
              if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;
              database.ref('Users/'+currentUser.id).once('value',function(s){
                  if(!s.exists()) return;
                  if(!isUserActiveForLogin(s.val())){
                      localStorage.removeItem('auth_user');
                      currentUser=null;
                      document.getElementById('dashboard_section').classList.add('hidden');
                      document.getElementById('login_section').classList.remove('hidden');
                      resetLoginUI();
                      setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');
                  }else{
                      startDAStatusWatcher();
                      showDashboard();
                  }
              });
          }
          """
          # Remove indentation added by YAML block for the JS replacement.
          import textwrap
          block=textwrap.dedent(block)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userbill.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair active DA login'
          git push
