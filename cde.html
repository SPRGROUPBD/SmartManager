<!DOCTYPE html>
<html>
<head>
    <title>Cash Denomination Entry</title>
    <style>
        body{
            font-family: Arial;
            background:#d4d0c8;
            margin:20px;
        }

        .container{
            width:700px;
            margin:auto;
            background:#c0c0c0;
            border:2px solid #808080;
            padding:10px;
            box-shadow: inset -2px -2px #fff,
                        inset 2px 2px #808080;
        }

        h2{
            text-align:center;
            background:navy;
            color:white;
            padding:8px;
            margin:0 0 10px;
            font-size:18px;
            letter-spacing:1px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid black;
            padding:8px;
            text-align:center;
        }

        th{
            background:#e0e0e0;
            font-size:13px;
        }

        input{
            text-align:center;
            padding:5px;
        }

        input.qty-input{
            width:80px;
        }

        .info-table input{
            width:100%;
            text-align:left;
            border:none;
            border-bottom:1px solid black;
            background:transparent;
            outline:none;
            padding:4px 8px;
            font-size:14px;
        }

        .info-table td{
            text-align:left;
            padding:4px 8px;
            border:none;
            font-weight:bold;
            width:180px;
            background:transparent;
        }

        .bottom-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:15px;
        }

        .btn-group{
            display:flex;
            gap:8px;
        }

        .total-box{
            font-size:18px;
            font-weight:bold;
            margin-right:10px;
        }

        .reset-btn, .print-btn{
            padding:8px 24px;
            font-size:14px;
            font-weight:bold;
            background:#c0c0c0;
            border:2px solid #808080;
            box-shadow: inset -1px -1px #fff,
                        inset 1px 1px #808080;
            cursor:pointer;
        }

        .reset-btn:active, .print-btn:active{
            box-shadow: inset 1px 1px #fff,
                        inset -1px -1px #808080;
        }

        .print-btn{
            background:navy;
            color:white;
            border-color:#000080;
        }

        .print-section{
            margin-top:15px;
            padding-top:15px;
            border-top:2px solid #808080;
        }

        .bank-info{
            margin-bottom:15px;
        }

        .in-words{
            text-align:left;
            font-size:14px;
            margin-top:10px;
            padding:8px;
            background:white;
            border:1px solid black;
            min-height:20px;
        }

        .in-words span{
            font-weight:bold;
        }

        .signature-area{
            display:flex;
            justify-content:space-between;
            margin-top:50px;
            padding:0 40px;
        }

        .signature-area div{
            text-align:center;
            font-weight:bold;
            font-size:14px;
        }

        .signature-line{
            border-top:1px solid black;
            padding-top:5px;
            margin-bottom:40px;
            min-width:150px;
        }

        /* Print Styles */
        @media print{
            @page{
                margin:10mm;
            }

            body{
                background:white;
                margin:0;
                padding:0;
            }

            .container{
                width:100%;
                max-width:700px;
                box-shadow:none;
                border:2px solid black;
                background:white;
                padding:10px;
            }

            .btn-group{
                display:none !important;
            }

            .bottom-row{
                justify-content:flex-end;
                padding-right:0;
                margin-right:0;
            }

            .total-box{
                margin-right:0;
            }

            .denom-row.empty-row{
                display:none !important;
            }

            input.qty-input{
                border:none;
                border-bottom:1px solid black;
                background:transparent;
            }

            .info-table input{
                border-bottom:1px solid black;
            }

            table{
                background:white;
            }

            .print-section{
                border-top:1px solid black;
            }

            .in-words{
                border:1px solid black;
            }
        }
    </style>
</head>
<body>

<div class="container" id="printArea">
    <h2>BANK CASH DEPOSIT SLIP</h2>

    <table>
        <tr>
            <th>Denomination</th>
            <th>Quantity</th>
            <th>Total Amount</th>
        </tr>

        <tbody id="denominationTable"></tbody>
    </table>

    <div class="bottom-row">
        <div class="btn-group">
            <button class="reset-btn" onclick="resetAll()">Reset</button>
            <button class="print-btn" onclick="printSlip()">Print</button>
        </div>
        <div class="total-box">
            Grand Total: ৳<span id="grandTotal">0</span>
        </div>
    </div>

    <div class="print-section">
        <div class="bank-info">
            <table class="info-table">
                <tr>
                    <td>AC No:</td>
                    <td><input type="text" id="acNo" placeholder="Enter Account Number"></td>
                </tr>
                <tr>
                    <td>Account Holder Name:</td>
                    <td><input type="text" id="accName" placeholder="Enter Account Holder Name"></td>
                </tr>
                <tr>
                    <td>Branch:</td>
                    <td><input type="text" id="branch" placeholder="Enter Branch Name"></td>
                </tr>
            </table>
        </div>

        <div class="in-words">
            In Words: <span id="inWords">Zero Taka Only</span>
        </div>

        <div class="signature-area">
            <div>
                <div class="signature-line"></div>
                Depositor's Signature
            </div>
            <div>
                <div class="signature-line"></div>
                Authorized Signature
            </div>
        </div>
    </div>
</div>

<script>
const denominations = [2,5,10,20,50,100,200,500,1000];
const tableBody = document.getElementById("denominationTable");

denominations.forEach((value,index) => {
    tableBody.innerHTML += `
        <tr class="denom-row empty-row" id="row${index}">
            <td>৳${value}</td>
            <td>
                <input 
                    type="number" 
                    class="qty-input qty" 
                    data-value="${value}" 
                    min="0"
                    oninput="calculateTotal()"
                    onkeydown="moveNext(event, ${index})"
                >
            </td>
            <td class="amount">0</td>
        </tr>
    `;
});

function calculateTotal(){
    let grandTotal = 0;

    document.querySelectorAll(".qty").forEach((input,index)=>{
        let qty = parseInt(input.value) || 0;
        let value = parseInt(input.dataset.value);
        let total = qty * value;
        let row = document.getElementById("row" + index);

        document.querySelectorAll(".amount")[index].innerText = total;

        if(qty > 0){
            row.classList.remove("empty-row");
        } else {
            row.classList.add("empty-row");
        }

        grandTotal += total;
    });

    document.getElementById("grandTotal").innerText = grandTotal;
    document.getElementById("inWords").innerText = numberToWords(grandTotal) + " Taka Only";
}

function moveNext(event, index){
    if(event.key === "Enter"){
        event.preventDefault();
        let inputs = document.querySelectorAll(".qty");
        if(index < inputs.length - 1){
            inputs[index + 1].focus();
            inputs[index + 1].select();
        }
    }
}

function resetAll(){
    document.querySelectorAll(".qty").forEach((input, index) => {
        input.value = "";
        document.getElementById("row" + index).classList.add("empty-row");
    });
    document.querySelectorAll(".amount").forEach(cell => {
        cell.innerText = "0";
    });
    document.getElementById("grandTotal").innerText = "0";
    document.getElementById("inWords").innerText = "Zero Taka Only";
    document.getElementById("acNo").value = "";
    document.getElementById("accName").value = "";
    document.getElementById("branch").value = "";
    document.querySelectorAll(".qty")[0].focus();
}

function printSlip(){
    window.print();
}

function numberToWords(num){
    if(num === 0) return "Zero";

    const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine",
                  "Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen",
                  "Seventeen","Eighteen","Nineteen"];
    const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

    if(num < 20) return ones[num];
    if(num < 100) return tens[Math.floor(num/10)] + (num%10 ? " " + ones[num%10] : "");
    if(num < 1000) return ones[Math.floor(num/100)] + " Hundred" + (num%100 ? " and " + numberToWords(num%100) : "");
    if(num < 100000) return numberToWords(Math.floor(num/1000)) + " Thousand" + (num%1000 ? " " + numberToWords(num%1000) : "");
    if(num < 10000000) return numberToWords(Math.floor(num/100000)) + " Lakh" + (num%100000 ? " " + numberToWords(num%100000) : "");
    return numberToWords(Math.floor(num/10000000)) + " Crore" + (num%10000000 ? " " + numberToWords(num%10000000) : "");
}
</script>

</body>
</html>
