name: Apply DA Deactivation Protection
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          original=s

          helper = r'''\nfunction isUserActive(u){\n    if(!u) return false;\n    return !(u.active===false || u.status==='inactive' || u.status==='deactivated' || u.deactivated===true);\n}\nfunction blockIfDeactivated(){\n    if(currentUser && currentUser.role==='user' && currentUser._activeChecked===false){\n        alert('এই DA ID Deactive করা হয়েছে। নতুন Entry দেওয়া যাবে না।');\n        return true;\n    }\n    return false;\n}\nfunction revalidateCurrentUser(){\n    if(!currentUser || !currentUser.id || currentUser.role!=='user') return;\n    database.ref('Users/'+currentUser.id).once('value',function(snap){\n        if(!snap.exists() || !isUserActive(snap.val())){\n            currentUser._activeChecked=false;\n            localStorage.removeItem('auth_user');\n            if(typeof logout==='function') logout();\n            else if(typeof showLogin==='function') showLogin();\n            alert('এই DA ID Deactive করা হয়েছে। Login আর ব্যবহার করা যাবে না।');\n        } else {\n            currentUser._activeChecked=true;\n            localStorage.setItem('auth_user',JSON.stringify(currentUser));\n        }\n    });\n}\n'''
          if 'function isUserActive(u)' not in s:
              marker='function resetLoginUI()'
              if marker not in s: raise SystemExit('resetLoginUI anchor not found')
              s=s.replace(marker, helper+'\n'+marker, 1)

          old='''        var d=lookedUpUser.data;\n    document.getElementById('w98_show_name').innerText=d.name||'—';'''
          if old not in s:
              old='''    var d=lookedUpUser.data;\n    document.getElementById('w98_show_name').innerText=d.name||'—';'''
          new='''    var d=lookedUpUser.data;\n    var userActive=isUserActive(d);\n    document.getElementById('w98_show_name').innerText=d.name||'—';'''
          if old not in s: raise SystemExit('showLookedUpUser anchor not found')
          s=s.replace(old,new,1)

          anchor="    document.getElementById('w98_login_btn').disabled=false;"
          repl="    document.getElementById('w98_login_btn').disabled=(d.role==='user' && !userActive);"
          if anchor not in s: raise SystemExit('login button anchor not found')
          s=s.replace(anchor,repl,1)

          anchor2="    setStatus('Found: '+d.name+' ('+roleLbl+') — Enter password','ok');"
          repl2="    if(d.role==='user' && !userActive) setStatus('This DA is Deactivated — Login blocked','err'); else setStatus('Found: '+d.name+' ('+roleLbl+') — Enter password','ok');"
          if anchor2 not in s: raise SystemExit('status anchor not found')
          s=s.replace(anchor2,repl2,1)

          anchor3="    if(lookedUpUser.data.password!==pwd){"
          repl3="    if(lookedUpUser.data.role==='user' && !isUserActive(lookedUpUser.data)){ setStatus('This DA is Deactivated — Login blocked','err'); return; }\n    if(lookedUpUser.data.password!==pwd){"
          if anchor3 not in s: raise SystemExit('password anchor not found')
          s=s.replace(anchor3,repl3,1)

          oldcur="currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null};"
          newcur="currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null,_activeChecked:isUserActive(d)};"
          if oldcur not in s: raise SystemExit('currentUser anchor not found')
          s=s.replace(oldcur,newcur,1)

          bill_anchor='function submitOrUpdateBill(statusType){'
          if bill_anchor not in s: raise SystemExit('bill function anchor not found')
          s=s.replace(bill_anchor,bill_anchor+"\n    if(blockIfDeactivated()) return;",1)

          create_anchor='''var userData={userId:userIdManual,name:name,phone:phone,depot:depot,username:username,password:password,role:role};'''
          create_repl='''var userData={userId:userIdManual,name:name,phone:phone,depot:depot,username:username,password:password,role:role,active:true,status:'active'};'''
          if create_anchor not in s: raise SystemExit('userData anchor not found')
          s=s.replace(create_anchor,create_repl,1)

          # Add an Active/Deactive column to the user table.
          th='<th class="text-center">Status</th>'
          if th not in s:
              oldth='<th class="text-center">Action</th>'
              if oldth not in s: raise SystemExit('user table header anchor not found')
              s=s.replace(oldth,th+'\n'+oldth,1)

          # Make user-list rows show status and provide a toggle button.
          if 'toggleUserActive(' not in s:
              fn=r'''\nfunction toggleUserActive(id){\n    if(!id) return;\n    database.ref('Users/'+id).once('value',function(snap){\n        if(!snap.exists()) return;\n        var u=snap.val()||{};\n        var active=isUserActive(u);\n        var next=!active;\n        var patch={active:next,status:next?'active':'deactivated'};\n        if(next){patch.reactivatedAt=new Date().toISOString();patch.reactivatedBy=(currentUser&&currentUser.name)||'Admin';}\n        else{patch.deactivatedAt=new Date().toISOString();patch.deactivatedBy=(currentUser&&currentUser.name)||'Admin';}\n        database.ref('Users/'+id).update(patch,function(err){\n            if(err) alert('Status update failed');\n            else { loadUserList(); loadDAListForFilters(); }\n        });\n    });\n}\n'''
              marker='function clearUserForm()'
              if marker not in s: raise SystemExit('clearUserForm anchor not found')
              s=s.replace(marker,fn+'\n'+marker,1)

          # Inject row status/toggle after a user row's Action cell is built, using a tolerant pattern.
          if 'data-da-status-cell' not in s:
              pat=r'(var\s+tr\s*=\s*document\.createElement\([\"\']tr[\"\']\);[\s\S]{0,12000}?)(tbody\.appendChild\(tr\);)'
              m=re.search(pat,s)
              if m:
                  section=m.group(1)
                  if 'tr.innerHTML' in section:
                      inject="""\n            var active=isUserActive(u);\n            var statusCell=document.createElement('td');\n            statusCell.className='text-center';\n            statusCell.setAttribute('data-da-status-cell','1');\n            statusCell.innerHTML=active?'<span class=\"badge bg-success\">Active</span>':'<span class=\"badge bg-danger\">Deactive</span>';\n            tr.insertBefore(statusCell,tr.lastElementChild);\n            var actionCell=tr.lastElementChild;\n            if(actionCell) actionCell.innerHTML += ' <button class=\"btn btn-sm '+(active?'btn-outline-danger':'btn-outline-success')+'\" onclick=\"toggleUserActive(\\\''+id+'\\\')\">'+(active?'Deactive':'Activate')+'</button>';\n"""
                      section=section+inject
                      s=s[:m.start(1)]+section+s[m.end(1):]

          # Revalidate cached DA sessions so deactivation takes effect without relying on localStorage.
          dom_anchor="""            currentUser = JSON.parse(savedUser);\n            showDashboard();"""
          if dom_anchor in s:
              s=s.replace(dom_anchor,"""            currentUser = JSON.parse(savedUser);\n            if(currentUser.role==='user'){ revalidateCurrentUser(); } else { showDashboard(); }""",1)

          if s==original: raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')

      - name: Commit patched admin.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet || git commit -m "Update DA deactivation and historical bill access"
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/da-deactivation.yml
          git commit -m "Remove one-time DA deactivation patch workflow"
          git push
