<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management - Kushtia Depot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0f1a;--bg2:#111827;--card:#151f30;--card2:#1a2740;--accent:#00d4aa;--accent2:#00f0c0;--accent-dim:#00a88a;--warn:#f59e0b;--danger:#ef4444;--text:#e8edf5;--text2:#8899b0;--muted:#4a5a72;--border:#1e2e44;--border2:#2a3d58}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim)}
.view{display:none;min-height:100vh}.view.active{display:flex}

#loginView{align-items:center;justify-content:center;position:relative}
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;animation:blobMove 20s ease-in-out infinite}
.blob:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%}
.blob:nth-child(2){width:400px;height:400px;background:#f59e0b;bottom:-10%;right:-10%;animation-delay:-7s}
.blob:nth-child(3){width:300px;height:300px;background:#ef4444;top:50%;left:50%;animation-delay:-14s}
@keyframes blobMove{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-80px) scale(1.1)}50%{transform:translate(-60px,40px) scale(.9)}75%{transform:translate(30px,60px) scale(1.05)}}

.login-card{background:rgba(21,31,48,.85);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:420px;max-width:92vw;position:relative;z-index:1;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.login-card h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.login-card p{color:var(--text2);font-size:14px;margin-top:4px}
.login-input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border .3s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border:none;border-radius:12px;color:#0a0f1a;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;margin-top:8px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,170,.3)}
.login-btn:active{transform:translateY(0)}

.dash-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.dash-header .logo-text{font-size:18px;font-weight:700;color:var(--accent)}

.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;overflow-y:auto;min-height:calc(100vh - 60px)}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--text2);cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(0,212,170,.05);color:var(--text)}
.sidebar-item.active{background:rgba(0,212,170,.08);color:var(--accent);border-left-color:var(--accent)}
.sidebar-item i{width:20px;text-align:center;font-size:15px}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:all .3s}
.card:hover{border-color:var(--border2)}
.stat-card{position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08}
.stat-card.green::after{background:var(--accent)}
.stat-card.amber::after{background:var(--warn)}
.stat-card.red::after{background:var(--danger)}
.stat-card.blue::after{background:#3b82f6}

.data-table{width:100%;border-collapse:separate;border-spacing:0}
.data-table th{background:var(--bg2);color:var(--text2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.data-table tr:hover td{background:rgba(0,212,170,.03)}

.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-size:12px;font-weight:700}
.badge.P{background:rgba(0,212,170,.15);color:#00d4aa}
.badge.A{background:rgba(239,68,68,.15);color:#ef4444}
.badge.T{background:rgba(59,130,246,.15);color:#60a5fa}
.badge.L{background:rgba(245,158,11,.15);color:#f59e0b}
.badge.H{background:rgba(168,85,247,.15);color:#a855f7}
.badge.small{width:26px;height:26px;font-size:11px;border-radius:6px}
.badge.mini{width:22px;height:22px;font-size:10px;border-radius:5px}

.btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#0a0f1a}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.15);color:#ef4444}.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-warn{background:rgba(245,158,11,.15);color:#f59e0b}.btn-warn:hover{background:rgba(245,158,11,.25)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:6px}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .3s}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-select option{background:var(--bg2);color:var(--text)}

.status-btn{width:56px;height:56px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text2);font-size:16px;font-weight:800;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.status-btn span{font-size:9px;font-weight:500;letter-spacing:.3px}
.status-btn:hover{border-color:var(--muted);transform:translateY(-2px)}
.status-btn.selected-P{border-color:#00d4aa;background:rgba(0,212,170,.1);color:#00d4aa}
.status-btn.selected-A{border-color:#ef4444;background:rgba(239,68,68,.1);color:#ef4444}
.status-btn.selected-T{border-color:#60a5fa;background:rgba(59,130,246,.1);color:#60a5fa}
.status-btn.selected-L{border-color:#f59e0b;background:rgba(245,158,11,.1);color:#f59e0b}
.status-btn.selected-H{border-color:#a855f7;background:rgba(168,85,247,.1);color:#a855f7}
.status-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 20px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn .4s ease;min-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.success{background:rgba(0,212,170,.15);border:1px solid rgba(0,212,170,.3);color:#00f0c0}
.toast.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.toast.info{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93bbfd}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(100px)}}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:32px;max-width:560px;width:100%;animation:modalIn .3s ease;max-height:90vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.active-badge{background:rgba(0,212,170,.12);color:#00d4aa;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.inactive-badge{background:rgba(239,68,68,.12);color:#ef4444;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.holiday-badge{background:rgba(168,85,247,.12);color:#a855f7;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.pending-badge{background:rgba(245,158,11,.12);color:#f59e0b;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.approved-badge{background:rgba(0,212,170,.12);color:#00d4aa;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}

#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;padding:20px;font-family:'Outfit',sans-serif;color:#111}
  #printArea table{width:100%;border-collapse:collapse;font-size:10px}
  #printArea th,#printArea td{border:1px solid #333;padding:4px 6px;text-align:center}
  #printArea th{background:#e5e7eb;font-weight:700;font-size:9px}
  #printArea h2{text-align:center;font-size:15px;margin-bottom:4px}
  #printArea h3{text-align:center;font-size:12px;color:#555;margin-bottom:12px}
  @page{size:landscape;margin:8mm}
}

.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fadeIn .4s ease both}
.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.15s}
.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.25s}
.stagger>*:nth-child(6){animation-delay:.3s}

@media(max-width:768px){
  .sidebar{width:60px;padding:10px 0}
  .sidebar-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent;font-size:0}
  .sidebar-item i{font-size:18px}
  .sidebar-item span{display:none}
  .sidebar-item.active{border-bottom-color:var(--accent);border-left-color:transparent}
  .login-card{padding:32px 24px}
  .dash-header{padding:12px 16px}
}

.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer;display:inline-block;vertical-align:middle}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--danger);border-radius:24px;transition:.3s}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
</style>
</head>
<body>

<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="toast-container" id="toastBox"></div>
<div id="modalOverlay" style="display:none"></div>

<!-- ===== LOGIN ===== -->
<div id="loginView" class="view active">
  <div class="login-card fade-in">
    <div class="flex items-center gap-3 mb-1">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center">
        <i class="fa-solid fa-clipboard-check" style="color:#0a0f1a;font-size:20px"></i>
      </div>
      <div><h1>Attendance System</h1><p>Kushtia Depot</p></div>
    </div>
    <div style="height:1px;background:var(--border);margin:24px 0"></div>
    <div class="form-group">
      <label class="form-label">User ID</label>
      <input class="login-input" id="loginId" placeholder="Enter your ID" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="login-input" id="loginPass" type="password" placeholder="Enter password">
    </div>
    <button class="login-btn" onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)"><i class="fa-solid fa-shield-halved"></i> Secure Attendance Management</p>
  </div>
</div>

<!-- ===== USER DASHBOARD ===== -->
<div id="userView" class="view" style="flex-direction:column">
  <header class="dash-header">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-clipboard-check" style="color:var(--accent);font-size:20px"></i>
      <span class="logo-text">Attendance System</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="userDisplayId" style="font-size:14px;color:var(--text2)"></span>
      <button class="btn btn-sm btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-sign-out"></i> Logout</button>
    </div>
  </header>
  <main id="userContent" style="flex:1;padding:28px;max-width:800px;margin:0 auto;width:100%"></main>
</div>

<!-- ===== DIC DASHBOARD ===== -->
<div id="dicView" class="view" style="flex-direction:column">
  <header class="dash-header">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-clipboard-check" style="color:var(--accent);font-size:20px"></i>
      <span class="logo-text">DIC Panel</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="dicDisplayId" style="font-size:14px;color:var(--text2)"></span>
      <button class="btn btn-sm btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-sign-out"></i> Logout</button>
    </div>
  </header>
  <div style="display:flex;flex:1;overflow:hidden">
    <aside class="sidebar" id="dicSidebar"></aside>
    <main id="dicContent" style="flex:1;padding:28px;overflow-y:auto;height:calc(100vh - 60px)"></main>
  </div>
</div>

<div id="printArea"></div>

<script>
/* ============================================================
   CONFIG & FIREBASE
   ============================================================ */
const DIC_ID = 'KUS-11182401';
const DIC_PASS = 'KUS-11182401';
const DB_URL = 'https://attendance-kushtia-default-rtdb.europe-west1.firebasedatabase.app';

const firebaseConfig = {
  apiKey: "AIzaSyBEg0R0YOOsFgKiyTv3QkyQv0Vhpym1lms",
  authDomain: "attendance-kushtia.firebaseapp.com",
  databaseURL: DB_URL,
  projectId: "attendance-kushtia",
  storageBucket: "attendance-kushtia.firebasestorage.app",
  messagingSenderId: "695383066612",
  appId: "1:695383066612:web:0d9f5a6dc5d1bbd0a6dba1",
  measurementId: "G-G21R0GPT2X"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let currentUser = null;
let allUsers = {};
let allHolidays = {};
let currentTab = 'overview';
let selectedStatus = '';

const DESIGNATIONS = [
  'Depot In-Charge',
  'Asst. Depot In-Charge',
  'Delivery Assistant',
  'Driver',
  'Helper'
];

/* ============================================================
   UTILITIES
   ============================================================ */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function formatBD(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function statusLabel(s) { return {P:'Present',A:'Absent',T:'Tour',L:'Leave',H:'Holiday'}[s] || s; }
function statusColor(s) { return {P:'#00d4aa',A:'#ef4444',T:'#60a5fa',L:'#f59e0b',H:'#a855f7'}[s] || '#666'; }
function monthName(m) { return ['January','February','March','April','May','June','July','August','September','October','November','December'][m]; }
function isHoliday(dateStr) { return allHolidays.hasOwnProperty(dateStr); }

/* Get effective attendance status - auto H for holidays */
function getAttStatus(dateStr, uid, attData) {
  if (attData && attData.status) return attData.status;
  if (isHoliday(dateStr)) return 'H';
  return '';
}

function showToast(msg, type) {
  type = type || 'info';
  var box = document.getElementById('toastBox');
  var icons = { success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle' };
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<i class="fa-solid ' + (icons[type]||icons.info) + '"></i><span>' + msg + '</span>';
  box.appendChild(t);
  setTimeout(function() { t.classList.add('out'); setTimeout(function() { t.remove(); }, 300); }, 3500);
}

function showModal(title, bodyHTML, onConfirm) {
  var ov = document.getElementById('modalOverlay');
  ov.style.display = 'flex';
  var btnHTML = onConfirm ? '<button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>' : '';
  ov.innerHTML = '<div class="modal-box">' +
    '<h3 style="font-size:18px;font-weight:700;margin-bottom:16px">' + title + '</h3>' +
    '<div>' + bodyHTML + '</div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px">' +
      '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' + btnHTML +
    '</div></div>';
  if (onConfirm) document.getElementById('modalConfirmBtn').onclick = function() { onConfirm(); closeModal(); };
  ov.onclick = function(e) { if (e.target === ov) closeModal(); };
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

function switchView(id) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

/* ============================================================
   FIREBASE DATA LOAD
   ============================================================ */
async function loadUsers() {
  try {
    var snap = await db.ref('users').once('value');
    allUsers = snap.val() || {};
  } catch(e) { showToast('Failed to load users: ' + e.message, 'error'); }
}
async function loadHolidays() {
  try {
    var snap = await db.ref('holidays').once('value');
    allHolidays = snap.val() || {};
  } catch(e) { showToast('Failed to load holidays', 'error'); }
}

/* ============================================================
   LOGIN / LOGOUT
   ============================================================ */
async function handleLogin() {
  var id = document.getElementById('loginId').value.trim();
  var pass = document.getElementById('loginPass').value.trim();
  if (!id || !pass) { showToast('Please enter ID and Password', 'error'); return; }

  /* DIC check */
  if (id === DIC_ID && pass === DIC_PASS) {
    var snap = await db.ref('users/' + DIC_ID).once('value');
    if (!snap.exists()) {
      await db.ref('users/' + DIC_ID).set({
        id: DIC_ID, name: 'Depot Incharge', designation: 'Depot In-Charge',
        depot: 'Kushtia', joinDate: todayStr(), salary: 0, mobile: '',
        role: 'DIC', password: DIC_PASS, active: true, createdAt: Date.now()
      });
    }
    currentUser = { id: DIC_ID, name: 'Depot Incharge', role: 'DIC' };
    await loadUsers();
    await loadHolidays();
    document.getElementById('dicDisplayId').textContent = DIC_ID;
    switchView('dicView');
    renderSidebar();
    showTab('overview');
    showToast('Welcome, Depot Incharge', 'success');
    return;
  }

  /* Normal user */
  try {
    var snap = await db.ref('users/' + id).once('value');
    if (!snap.exists()) { showToast('User not found', 'error'); return; }
    var data = snap.val();
    if (data.password !== pass) { showToast('Wrong password', 'error'); return; }
    if (data.active === false) { showToast('Account deactivated. Contact DIC.', 'error'); return; }
    currentUser = data;
    await loadHolidays();
    document.getElementById('userDisplayId').textContent = id;
    switchView('userView');
    renderUserDashboard();
    showToast('Welcome, ' + data.name, 'success');
  } catch(e) { showToast('Login error: ' + e.message, 'error'); }
}

function handleLogout() {
  currentUser = null;
  allUsers = {};
  allHolidays = {};
  document.getElementById('loginId').value = '';
  document.getElementById('loginPass').value = '';
  switchView('loginView');
  showToast('Logged out', 'info');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginView').classList.contains('active')) handleLogin();
});

/* ============================================================
   USER DASHBOARD
   ============================================================ */
function renderUserDashboard() {
  var c = document.getElementById('userContent');
  var today = todayStr();
  var hol = isHoliday(today);

  var holStyle = hol ? 'display:flex' : 'display:none';
  var holClass = hol ? ' selected-H' : '';

  c.innerHTML = '<div class="fade-in">' +

function onUserDateChange() {
  var date = document.getElementById('userDate').value;
  var hol = isHoliday(date);
  var notice = document.getElementById('holidayNotice');
  notice.style.display = hol ? 'flex' : 'none';
  var btns = document.querySelectorAll('#userStatusBtns .status-btn');
  btns.forEach(function(b) {
    var s = b.dataset.s;
    b.disabled = (hol && s !== 'H') || (!hol && s === 'H');
    b.className = 'status-btn' + (hol && s === 'H' ? ' selected-H' : '');
  });
  selectedStatus = hol ? 'H' : '';
  loadUserHistory(date);
}

function selectUserStatus(s) {
  selectedStatus = s;
  document.querySelectorAll('#userStatusBtns .status-btn').forEach(function(b) {
    b.className = 'status-btn' + (b.dataset.s === s ? ' selected-' + s : '');
  });
}

async function userSubmitAttendance() {
  var date = document.getElementById('userDate').value;
  if (!date) { showToast('Select a date', 'error'); return; }
  if (!selectedStatus) { showToast('Select attendance status', 'error'); return; }
  if (date > todayStr()) { showToast('Cannot submit for future date', 'error'); return; }

  var existing = await db.ref('attendance/' + date + '/' + currentUser.id).once('value');
  if (existing.exists() && existing.val().approved) {
    showToast('Already approved, contact DIC for changes', 'error'); return;
  }

  var data = { status: selectedStatus, approved: false, submittedBy: currentUser.id, submittedAt: Date.now() };
  await db.ref('attendance/' + date + '/' + currentUser.id).set(data);
  document.getElementById('userSubmitMsg').innerHTML = '<span style="color:var(--warn)"><i class="fa-solid fa-clock"></i> Submitted - Pending DIC Approval</span>';
  showToast('Attendance submitted', 'success');
  loadUserHistory(date);
}

async function loadUserHistory(date) {
  var d = date || todayStr();
  var container = document.getElementById('userHistoryTable');
  var parts = d.split('-');
  var y = parseInt(parts[0]), m = parseInt(parts[1]) - 1;
  var days = getDaysInMonth(y, m);
  var rows = '';
  for (var i = days; i >= 1; i--) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(i).padStart(2,'0');
    var snap = await db.ref('attendance/' + ds + '/' + currentUser.id).once('value');
    var att = snap.val();
    var hol = isHoliday(ds);
    var s = getAttStatus(ds, currentUser.id, att);
    var dayName = new Date(ds + 'T00:00:00').toLocaleDateString('en', { weekday: 'short' });
    var holBadge = hol ? '<span class="holiday-badge">Holiday</span>' : '';
    var sBadge = s ? '<span class="badge ' + s + '">' + s + '</span> ' + statusLabel(s) : '<span style="color:var(--muted);font-size:12px">--</span>';
    var approval = att ? (att.approved ? '<span class="approved-badge">Approved</span>' : '<span class="pending-badge">Pending</span>') : (hol ? '<span class="approved-badge">Auto</span>' : '');
    rows += '<tr><td>' + formatBD(ds) + '</td><td style="color:var(--text2);font-size:12px">' + dayName + '</td><td>' + holBadge + '</td><td>' + sBadge + '</td><td>' + approval + '</td></tr>';
  }
  container.innerHTML = '<table class="data-table"><thead><tr><th>Date</th><th>Day</th><th>Note</th><th>Status</th><th>Approval</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function renderOverview() {
  await loadUsers();
  var today = todayStr();

  var todayAtt = snap.val() || {};
  var activeUsers = Object.entries(allUsers).filter(function(e) { return e[1].role !== 'DIC' && e[1].active !== false; });

  for (var i = 0; i < activeUsers.length; i++) {

    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">No submissions today</td></tr>';

    return (ua?ua.name:'').localeCompare(ub?ub.name:'');
  });
  var rowsHTML = '';
  for (var j = 0; j < entries.length; j++) {
    var uid2 = entries[j][0], a2 = entries[j][1];

async function bulkSubmit() {
  var date = document.getElementById('bulkDate').value;

    '<p style="color:var(--text2);font-size:14px">Apply <strong>' + statusLabel(status) + '</strong> for ALL active users on <strong>' + formatBD(date) + '</strong>?</p>' +
    '<p style="color:var(--warn);font-size:12px;margin-top:8px">This will overwrite unapproved entries.</p>',

      Object.entries(allUsers).filter(function(e) { return e[1].active !== false; }).forEach(function(e) {

async function renderApprovals() {

async function loadApprovals() {
  var date = document.getElementById('approvalDate').value;
  if (!date) return;
  var snap = await db.ref('attendance/' + date).once('value');
  var att = snap.val() || {};
  var container = document.getElementById('approvalTable');
  var pending = Object.entries(att).filter(function(e) { return !e[1].approved && e[0] !== DIC_ID; });

  if (pending.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)"><i class="fa-solid fa-check-double" style="font-size:32px;margin-bottom:12px;display:block;color:var(--accent)"></i>No pending approvals for this date</div>';
    return;
  }

  pending.sort(function(a,b) {
    var ua = allUsers[a[0]], ub = allUsers[b[0]];
    return (ua?ua.name:'').localeCompare(ub?ub.name:'');
  });

  var rows = '';
  for (var i = 0; i < pending.length; i++) {
    var uid = pending[i][0], a = pending[i][1];
    var u = allUsers[uid];
    rows += '<tr><td style="font-weight:600">' + (u?u.name:uid) + '</td>' +
      '<td style="font-size:11px;color:var(--text2)">' + (u?u.designation:'--') + '</td>' +
      '<td><span class="badge ' + a.status + '">' + a.status + '</span> ' + statusLabel(a.status) + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn btn-xs btn-primary" onclick="approveSingle(\'' + date + '\',\'' + uid + '\')"><i class="fa-solid fa-check"></i> Approve</button>' +
        '<button class="btn btn-xs btn-danger" onclick="rejectSingle(\'' + date + '\',\'' + uid + '\')" style="margin-left:4px"><i class="fa-solid fa-trash"></i></button>' +
      '</td></tr>';
  }
  container.innerHTML = '<table class="data-table"><thead><tr><th>Name</th><th>Designation</th><th>Status</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="margin-top:16px"><button class="btn btn-primary" onclick="approveAll(\'' + date + '\')"><i class="fa-solid fa-check-double"></i> Approve All Pending</button></div>';
}

async function approveSingle(date, uid) {
  await db.ref('attendance/' + date + '/' + uid + '/approved').set(true);
  showToast('Approved', 'success'); loadApprovals();
}
async function rejectSingle(date, uid) {
  await db.ref('attendance/' + date + '/' + uid).remove();
  showToast('Entry removed', 'info'); loadApprovals();
}
async function approveAll(date) {
  var snap = await db.ref('attendance/' + date).once('value');
  var att = snap.val() || {};
  var updates = {};
  Object.entries(att).forEach(function(e) { if (!e[1].approved && e[0] !== DIC_ID) updates[e[0] + '/approved'] = true; });
  if (Object.keys(updates).length === 0) { showToast('Nothing to approve', 'info'); return; }
  await db.ref('attendance/' + date).update(updates);
  showToast('All pending entries approved', 'success'); loadApprovals();
}

  var filterUser = document.getElementById('recordUser').value;
  if (!date) return;
  var snap = await db.ref('attendance/' + date).once('value');
  var att = snap.val() || {};
  var hol = isHoliday(date);

  var entries = Object.entries(att);
  if (filterUser) entries = entries.filter(function(e) { return e[0] === filterUser; });
  entries.sort(function(a,b) {
    var ua = allUsers[a[0]], ub = allUsers[b[0]];
    return (ua?ua.name:'').localeCompare(ub?ub.name:'');
  });

  var container = document.getElementById('recordsTable');
  if (entries.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No records found' + (hol ? ' <span class="holiday-badge">Holiday</span>' : '') + '</div>';
    return;
  }

  var rows = '';
  for (var i = 0; i < entries.length; i++) {
    var uid = entries[i][0], a = entries[i][1];
    var u = allUsers[uid];
    var s = getAttStatus(date, uid, a);
    rows += '<tr><td style="font-weight:600">' + (u?u.name:uid) + '</td>' +
      '<td style="font-size:11px;color:var(--text2)">' + (u?u.designation:'--') + '</td>' +
      '<td style="font-size:11px;color:var(--text2)">' + (u?u.depot:'--') + '</td>' +
      '<td>' + (s==='H' ? '<span class="holiday-badge">Holiday</span>' : '<span class="badge ' + s + '">' + s + '</span> ' + statusLabel(s)) + '</td>' +
      '<td>' + (a.approved ? '<span class="approved-badge">Approved</span>' : '<span class="pending-badge">Pending</span>') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn btn-xs btn-warn" onclick="editAttModal(\'' + date + '\',\'' + uid + '\',\'' + s + '\')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn btn-xs btn-danger" onclick="deleteAtt(\'' + date + '\',\'' + uid + '\')" style="margin-left:4px"><i class="fa-solid fa-trash"></i></button>' +
      '</td></tr>';
  }
  container.innerHTML = '<table class="data-table"><thead><tr><th>Name</th><th>Designation</th><th>Depot</th><th>Status</th><th>Approval</th><th>Action</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function editAttModal(date, uid, current) {

  var optHTML = '';
  for (var i = 0; i < options.length; i++) {
    optHTML += '<option value="' + options[i] + '"' + (options[i]===current?' selected':'') + '>' + options[i] + ' - ' + statusLabel(options[i]) + '</option>';

function deleteAtt(date, uid) {
  var u = allUsers[uid];

async function createUser() {
  var id = document.getElementById('nuId').value.trim();
  var pass = document.getElementById('nuPass').value.trim();
  var name = document.getElementById('nuName').value.trim();
  var desig = document.getElementById('nuDesig').value;
  var depot = document.getElementById('nuDepot').value.trim();
  var mobile = document.getElementById('nuMobile').value.trim();
  var salary = parseFloat(document.getElementById('nuSalary').value) || 0;
  var joinDate = document.getElementById('nuJoin').value;

  if (!id || !pass || !name || !depot) { showToast('ID, Password, Name and Depot are required', 'error'); return; }
  if (id === DIC_ID) { showToast('This ID is reserved for DIC', 'error'); return; }

  var existing = await db.ref('users/' + id).once('value');
  if (existing.exists()) { showToast('User ID already exists', 'error'); return; }

  var userData = { id:id, name:name, designation:desig, depot:depot, joinDate:joinDate, salary:salary, mobile:mobile, role:desig, password:pass, active:true, createdAt:Date.now() };
  await db.ref('users/' + id).set(userData);
  allUsers[id] = userData;
  showToast('User created: ' + name, 'success');
  renderUsers();
}

async function updateUser(uid) {
  var name = document.getElementById('euName').value.trim();
  var pass = document.getElementById('euPass').value.trim();
  var desig = document.getElementById('euDesig').value;
  var depot = document.getElementById('euDepot').value.trim();
  var mobile = document.getElementById('euMobile').value.trim();
  var salary = parseFloat(document.getElementById('euSalary').value) || 0;
  var joinDate = document.getElementById('euJoin').value;

  if (!name || !depot) { showToast('Name and Depot are required', 'error'); return; }

  var updates = { name:name, designation:desig, depot:depot, mobile:mobile, salary:salary, joinDate:joinDate, role:desig };
  if (pass) updates.password = pass;

  await db.ref('users/' + uid).update(updates);
  allUsers[uid] = Object.assign({}, allUsers[uid], updates);
  showToast('User updated: ' + name, 'success');
  document.getElementById('addUserFormArea').innerHTML = '';
  renderUsers();
}

function deleteUser(uid) {
  var u = allUsers[uid];
  showModal('Delete User',
    '<p style="color:var(--text2)">Delete <strong>' + (u?u.name:uid) + '</strong>?</p><p style="color:var(--danger);font-size:12px;margin-top:8px">Attendance records will NOT be deleted.</p>',
    async function() {
      await db.ref('users/' + uid).remove();
      delete allUsers[uid];
      showToast('User deleted', 'info');
      renderUsers();
    }
  );
}

var lastReportHTML = '';
async function generateReport() {
  var m = parseInt(document.getElementById('repMonth').value);
  var y = parseInt(document.getElementById('repYear').value);
  var days = getDaysInMonth(y, m);
  var users = Object.entries(allUsers).filter(function(e) { return e[1].role !== 'DIC' && e[1].active !== false; }).sort(function(a,b) { return a[1].name.localeCompare(b[1].name); });

  if (users.length === 0) { showToast('No active users found', 'error'); return; }

  /* Load full month attendance */
  var allAtt = {};
  for (var d = 1; d <= days; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var snap = await db.ref('attendance/' + ds).once('value');
    allAtt[ds] = snap.val() || {};
  }

  /* Build table header */
  var headerCells = '<th style="min-width:140px;text-align:left">Name</th><th style="min-width:85px;text-align:left;font-size:10px">Designation</th><th style="min-width:70px;text-align:left;font-size:10px">Depot</th>';
  for (var d = 1; d <= days; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var hol = isHoliday(ds);
    var holStyle = hol ? 'background:rgba(168,85,247,.1);color:#a855f7' : '';
    headerCells += '<th style="min-width:28px;' + holStyle + '" title="' + formatBD(ds) + '">' + d + '</th>';
  }
  headerCells += '<th>P</th><th>A</th><th>T</th><th>L</th><th>H</th>';

  var bodyRows = '';
  for (var i = 0; i < users.length; i++) {
    var uid = users[i][0], u = users[i][1];
    var cells = '<td style="font-weight:600;text-align:left">' + u.name + '</td>' +
      '<td style="text-align:left;font-size:10px;color:var(--text2)">' + (u.designation||'') + '</td>' +
      '<td style="text-align:left;font-size:10px;color:var(--text2)">' + (u.depot||'') + '</td>';
    var counts = { P:0, A:0, T:0, L:0, H:0 };
    for (var d = 1; d <= days; d++) {
      var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var attData = allAtt[ds][uid];
      var s = getAttStatus(ds, uid, attData);
      if (s && counts.hasOwnProperty(s)) counts[s]++;
      var hol = isHoliday(ds);
      var holBg = hol ? 'background:rgba(168,85,247,.04)' : '';
      cells += '<td style="' + holBg + '">' + (s ? '<span class="badge mini ' + s + '">' + s + '</span>' : '') + '</td>';
    }
    cells += '<td style="font-weight:700;color:#00d4aa;font-size:12px">' + counts.P + '</td>' +
      '<td style="font-weight:700;color:#ef4444;font-size:12px">' + counts.A + '</td>' +
      '<td style="font-weight:700;color:#60a5fa;font-size:12px">' + counts.T + '</td>' +
      '<td style="font-weight:700;color:#f59e0b;font-size:12px">' + counts.L + '</td>' +
      '<td style="font-weight:700;color:#a855f7;font-size:12px">' + counts.H + '</td>';
    bodyRows += '<tr>' + cells + '</tr>';
  }

  /* Holiday legend */
  var holidayList = '';
  for (var d = 1; d <= days; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    if (isHoliday(ds)) holidayList += '<span class="holiday-badge" style="margin:2px">' + d + ': ' + allHolidays[ds] + '</span> ';
  }

  var tableHTML = (holidayList ? '<div style="margin-bottom:12px">' + holidayList + '</div>' : '') +
    '<table class="data-table" id="reportTable"><thead><tr>' + headerCells + '</tr></thead><tbody>' + bodyRows + '</tbody></table>';

  document.getElementById('reportArea').innerHTML = tableHTML;
  document.getElementById('printReportBtn').style.display = 'inline-flex';

  /* Print HTML */
  var phCells = '<th>Name</th><th>Desig.</th><th>Depot</th>';
  for (var d = 1; d <= days; d++) phCells += '<th>' + d + '</th>';
  phCells += '<th>P</th><th>A</th><th>T</th><th>L</th><th>H</th>';

  var pbRows = '';
  for (var i = 0; i < users.length; i++) {
    var uid = users[i][0], u = users[i][1];
    var cells = '<td style="text-align:left">' + u.name + '</td><td>' + (u.designation||'') + '</td><td>' + (u.depot||'') + '</td>';
    var counts = { P:0, A:0, T:0, L:0, H:0 };
    for (var d = 1; d <= days; d++) {
      var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var attData = allAtt[ds][uid];
      var s = getAttStatus(ds, uid, attData);
      if (s && counts.hasOwnProperty(s)) counts[s]++;
      cells += '<td style="color:' + statusColor(s) + ';font-weight:700">' + (s||'') + '</td>';
    }
    cells += '<td>' + counts.P + '</td><td>' + counts.A + '</td><td>' + counts.T + '</td><td>' + counts.L + '</td><td>' + counts.H + '</td>';
    pbRows += '<tr>' + cells + '</tr>';
  }

  lastReportHTML = '<h2>ATTENDANCE REPORT - ' + monthName(m).toUpperCase() + ' ' + y + '</h2>' +
    '<h3>Kushtia Depot</h3>' +
    '<table><thead><tr>' + phCells + '</tr></thead><tbody>' + pbRows + '</tbody></table>' +
    '<p style="margin-top:10px;font-size:9px;color:#888">Generated: ' + new Date().toLocaleString() + '</p>';
}

function printReport() {
  if (!lastReportHTML) { showToast('Generate report first', 'error'); return; }
  document.getElementById('printArea').innerHTML = lastReportHTML;
  setTimeout(function() { window.print(); }, 200);
}

var lastSalaryHTML = '';
async function generateSalarySheet() {
  var m = parseInt(document.getElementById('salMonth').value);
  var y = parseInt(document.getElementById('salYear').value);
  var days = getDaysInMonth(y, m);
  var users = Object.entries(allUsers).filter(function(e) { return e[1].active !== false && e[1].salary > 0; }).sort(function(a,b) { return a[1].name.localeCompare(b[1].name); });

  if (users.length === 0) {
    document.getElementById('salaryArea').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No active users with salary found. Set salary in Manage Users first.</div>';
    showToast('No users with salary', 'error');
    return;
  }

  /* Load full month attendance */
  var allAtt = {};
  for (var d = 1; d <= days; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var snap = await db.ref('attendance/' + ds).once('value');
    allAtt[ds] = snap.val() || {};
  }

  var rows = '';
  var totalBasic=0, totalDeduct=0, totalNet=0;

  for (var i = 0; i < users.length; i++) {
    var uid = users[i][0], u = users[i][1];
    var counts = { P:0, A:0, T:0, L:0, H:0 };
    for (var d = 1; d <= days; d++) {
      var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var attData = allAtt[ds][uid];
      var s = getAttStatus(ds, uid, attData);
      if (s && counts.hasOwnProperty(s)) counts[s]++;
    }

    var basic = u.salary;
    var perDay = basic / days;
    var deduct = Math.round(perDay * counts.A);
    var net = basic - deduct;
    totalBasic += basic;
    totalDeduct += deduct;
    totalNet += net;

    rows += '<tr>' +
      '<td style="font-weight:600">' + u.name + '</td>' +
      '<td style="font-size:11px;color:var(--text2)">' + (u.designation||'') + '</td>' +
      '<td style="font-size:11px;color:var(--text2)">' + (u.depot||'') + '</td>' +
      '<td style="font-weight:600;color:var(--accent)">৳' + basic.toLocaleString() + '</td>' +
      '<td style="color:#00d4aa;font-weight:700">' + counts.P + '</td>' +
      '<td style="color:#ef4444;font-weight:700">' + counts.A + '</td>' +
      '<td style="color:#60a5fa;font-weight:700">' + counts.T + '</td>' +
      '<td style="color:#f59e0b;font-weight:700">' + counts.L + '</td>' +
      '<td style="color:#a855f7;font-weight:700">' + counts.H + '</td>' +
      '<td style="font-weight:600">' + days + '</td>' +
      '<td style="color:#ef4444;font-weight:700">৳' + deduct.toLocaleString() + '</td>' +
      '<td style="color:var(--accent);font-weight:800;font-size:14px">৳' + net.toLocaleString() + '</td>' +
    '</tr>';
  }

  var tableHTML = '<table class="data-table" id="salaryTable">' +
    '<thead><tr><th>Name</th><th>Designation</th><th>Depot</th><th>Basic (৳)</th><th>Present</th><th>Absent</th><th>Tour</th><th>Leave</th><th>Holiday</th><th>Total Days</th><th>Deduction (৳)</th><th>Net Salary (৳)</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr style="font-weight:800;border-top:2px solid var(--border2)">' +
      '<td colspan="3" style="text-align:right;color:var(--text2)">TOTAL</td>' +
      '<td style="color:var(--accent)">৳' + totalBasic.toLocaleString() + '</td>' +
      '<td></td><td></td><td></td><td></td><td></td><td></td>' +
      '<td style="color:#ef4444">৳' + totalDeduct.toLocaleString() + '</td>' +
      '<td style="color:var(--accent);font-size:15px">৳' + totalNet.toLocaleString() + '</td>' +
    '</tr></tfoot></table>' +
    '<p style="margin-top:16px;font-size:12px;color:var(--text2)"><i class="fa-solid fa-info-circle" style="color:var(--accent)"></i> Deduction = (Basic / ' + days + ' days) &times; Absent days. Tour, Leave &amp; Holiday are paid. Holidays auto-counted.</p>';

  document.getElementById('salaryArea').innerHTML = tableHTML;
  document.getElementById('printSalBtn').style.display = 'inline-flex';

  /* Print version */
  var printRows = '';
  for (var i = 0; i < users.length; i++) {
    var uid = users[i][0], u = users[i][1];
    var counts = { P:0, A:0, T:0, L:0, H:0 };
    for (var d = 1; d <= days; d++) {
      var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var attData = allAtt[ds][uid];
      var s = getAttStatus(ds, uid, attData);
      if (s && counts.hasOwnProperty(s)) counts[s]++;
    }
    var basic = u.salary;
    var deduct = Math.round((basic/days) * counts.A);
    var net = basic - deduct;
    printRows += '<tr><td style="text-align:left">' + u.name + '</td><td>' + (u.designation||'') + '</td><td>' + (u.depot||'') + '</td>' +
      '<td>' + basic.toLocaleString() + '</td>' +
      '<td>' + counts.P + '</td><td>' + counts.A + '</td><td>' + counts.T + '</td><td>' + counts.L + '</td><td>' + counts.H + '</td>' +
      '<td>' + days + '</td><td>' + deduct.toLocaleString() + '</td><td>' + net.toLocaleString() + '</td></tr>';
  }

  lastSalaryHTML = '<h2>SALARY SHEET - ' + monthName(m).toUpperCase() + ' ' + y + '</h2>' +
    '<h3>Kushtia Depot | Total Days: ' + days + '</h3>' +
    '<table><thead><tr><th>Name</th><th>Desig.</th><th>Depot</th><th>Basic</th><th>P</th><th>A</th><th>T</th><th>L</th><th>H</th><th>Days</th><th>Deduct</th><th>Net</th></tr></thead>' +
    '<tbody>' + printRows + '</tbody>' +
    '<tfoot><tr style="font-weight:bold;border-top:2px solid #333"><td colspan="3" style="text-align:right">TOTAL</td>' +
    '<td>' + totalBasic.toLocaleString() + '</td><td></td><td></td><td></td><td></td><td></td><td></td>' +
    '<td>' + totalDeduct.toLocaleString() + '</td><td>' + totalNet.toLocaleString() + '</td></tr></tfoot></table>' +
    '<p style="margin-top:10px;font-size:9px;color:#666">Deduction = (Basic / ' + days + ') x Absent. Tour, Leave & Holiday paid. | Generated: ' + new Date().toLocaleString() + '</p>';
}

function printSalary() {
  if (!lastSalaryHTML) { showToast('Generate salary sheet first', 'error'); return; }
  document.getElementById('printArea').innerHTML = lastSalaryHTML;
  setTimeout(function() { window.print(); }, 200);
}

/* ============================================================
   DIC - HOLIDAYS
   ============================================================ */
async function renderHolidays() {
  await loadHolidays();
  var sorted = Object.entries(allHolidays).sort(function(a,b) { return a[0].localeCompare(b[0]); });

  var listHTML = '';
  if (sorted.length === 0) {
    listHTML = '<div style="text-align:center;padding:30px;color:var(--muted)">No holidays added yet</div>';
  } else {
    var rowsHTML = '';
    for (var i = 0; i < sorted.length; i++) {
      var d = sorted[i][0], n = sorted[i][1];
      var dayName = new Date(d+'T00:00:00').toLocaleDateString('en',{weekday:'long'});
      rowsHTML += '<tr><td style="font-weight:600">' + formatBD(d) + '</td><td style="color:var(--text2);font-size:12px">' + dayName + '</td><td><span class="holiday-badge">' + n + '</span></td><td><button class="btn btn-xs btn-danger" onclick="removeHoliday(\'' + d + '\')"><i class="fa-solid fa-trash"></i></button></td></tr>';
    }
    listHTML = '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Date</th><th>Day</th><th>Holiday Name</th><th>Action</th></tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  }

  document.getElementById('dicContent').innerHTML = '<div class="fade-in">' +
    '<h2 style="font-size:22px;font-weight:800;margin-bottom:20px">Manage Holidays</h2>' +
    '<div class="card" style="margin-bottom:20px">' +
      '<h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Add Holiday</h3>' +
      '<div style="display:flex;gap:14px;align-items:end;flex-wrap:wrap">' +
        '<div class="form-group" style="margin:0;min-width:180px"><label class="form-label">Date</label><input type="date" class="form-input" id="holDate"></div>' +
        '<div class="form-group" style="margin:0;min-width:250px"><label class="form-label">Holiday Name</label><input class="form-input" id="holName" placeholder="e.g. Independence Day"></div>' +
        '<button class="btn btn-primary" onclick="addHoliday()"><i class="fa-solid fa-plus"></i> Add</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
        '<h3 style="font-size:16px;font-weight:700">Holiday List (' + sorted.length + ')</h3>' +
        '<button class="btn btn-sm btn-danger" onclick="clearAllHolidays()"' + (sorted.length===0?' disabled':'') + '><i class="fa-solid fa-trash"></i> Clear All</button>' +
      '</div>' + listHTML +
    '</div></div>';
}

async function addHoliday() {
  var date = document.getElementById('holDate').value;
  var name = document.getElementById('holName').value.trim();
  if (!date || !name) { showToast('Date and name are required', 'error'); return; }
  await db.ref('holidays/' + date).set(name);
  allHolidays[date] = name;
  showToast('Holiday added', 'success');
  renderHolidays();
}

async function removeHoliday(date) {
  await db.ref('holidays/' + date).remove();
  delete allHolidays[date];
  showToast('Holiday removed', 'info');
  renderHolidays();
}

function clearAllHolidays() {
  showModal('Clear All Holidays',
    '<p style="color:var(--text2)">Remove ALL holidays? This cannot be undone.</p>',
    async function() {
      await db.ref('holidays').remove();
      allHolidays = {};
      showToast('All holidays cleared', 'info');
      renderHolidays();
    }
  );
}

   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginId').focus();
});
</script>
