<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Soho Cam — Live Location Camera</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f0ece4;
            --muted: #7a7568;
            --accent: #e8c547;
            --accent2: #ff6b35;
            --card: rgba(20, 19, 16, 0.85);
            --border: rgba(232, 197, 71, 0.15);
            --glass: rgba(10, 10, 10, 0.6);
            --success: #4ade80;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* === ব্যাকগ্রাউন্ড অ্যানিমেশন === */
        .bg-pulse {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-pulse::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(ellipse at 30% 20%, rgba(232,197,71,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(255,107,53,0.04) 0%, transparent 50%);
            animation: bgDrift 12s ease-in-out infinite alternate;
        }
        @keyframes bgDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-3%, 2%) rotate(2deg); }
        }

        /* === ক্যামেরা ভিউ === */
        .camera-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* টপ বার */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
        }
        .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gps-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
            transition: all 0.4s ease;
        }
        .gps-badge.active {
            border-color: var(--success);
            color: var(--success);
        }
        .gps-badge .gps-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--danger);
            transition: background 0.4s ease;
        }
        .gps-badge.active .gps-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: blink 1s ease-in-out infinite;
        }

        .timestamp-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 5px 12px;
        }

        /* ক্যামেরা ভিডিও */
        .video-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #111;
        }
        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #captureCanvas {
            display: none;
        }

        /* ক্যামেরা গ্রিড ওভারলে */
        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        .grid-overlay .h-line,
        .grid-overlay .v-line {
            position: absolute;
            background: rgba(255,255,255,0.08);
        }
        .grid-overlay .h-line {
            left: 0; right: 0; height: 1px;
        }
        .grid-overlay .v-line {
            top: 0; bottom: 0; width: 1px;
        }
        .grid-overlay .h-line:nth-child(1) { top: 33.33%; }
        .grid-overlay .h-line:nth-child(2) { top: 66.66%; }
        .grid-overlay .v-line:nth-child(3) { left: 33.33%; }
        .grid-overlay .v-line:nth-child(4) { left: 66.66%; }

        /* ফোকাস রিং */
        .focus-ring {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 1.5px solid var(--accent);
            border-radius: 2px;
            pointer-events: none;
            z-index: 6;
            opacity: 0;
            transform: scale(1.5);
            transition: opacity 0.3s, transform 0.3s;
        }
        .focus-ring.show {
            opacity: 1;
            transform: scale(1);
        }

        /* ফ্ল্যাশ অ্যানিমেশন */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease;
        }
        .flash-overlay.flash {
            opacity: 0.85;
        }

        /* === লোকেশন ফুটার === */
        .location-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            padding: 40px 16px 16px;
        }
        .location-info {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 14px;
        }
        .location-icon-wrap {
            width: 36px;
            height: 36px;
            background: rgba(232,197,71,0.15);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .location-icon-wrap i {
            color: var(--accent);
            font-size: 14px;
        }
        .location-details {
            flex: 1;
            min-width: 0;
        }
        .location-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .location-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .location-accuracy {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* ক্যাপচার কন্ট্রোল */
        .capture-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--fg);
            font-size: 16px;
        }
        .ctrl-btn:hover {
            border-color: var(--accent);
            background: rgba(232,197,71,0.12);
            color: var(--accent);
            transform: scale(1.08);
        }
        .ctrl-btn:active { transform: scale(0.95); }

        .shutter-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .shutter-btn::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--accent);
            transition: all 0.15s ease;
        }
        .shutter-btn:hover { transform: scale(1.06); }
        .shutter-btn:active {
            transform: scale(0.94);
        }
        .shutter-btn:active::after {
            background: var(--accent2);
        }

        .gallery-btn {
            position: relative;
        }
        .gallery-count {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: var(--accent2);
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }
        .gallery-count.show {
            opacity: 1;
            transform: scale(1);
        }

        /* === প্রিভিউ মোডাল === */
        .preview-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .preview-modal.open {
            display: flex;
            opacity: 1;
        }
        .preview-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .preview-top h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .preview-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: var(--fg);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .preview-close:hover {
            background: rgba(255,255,255,0.15);
        }
        .preview-image-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
        }
        .preview-image-wrap img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            object-fit: contain;
        }
        .preview-footer {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .preview-location {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(232,197,71,0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .preview-location i {
            color: var(--accent);
            font-size: 16px;
        }
        .preview-location-info {
            flex: 1;
        }
        .preview-location-name {
            font-size: 13px;
            font-weight: 600;
        }
        .preview-location-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            margin-top: 2px;
        }
        .preview-location-time {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
        }
        .preview-action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-download {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-download:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-share {
            background: rgba(255,255,255,0.08);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-share:hover { background: rgba(255,255,255,0.14); }

        /* === গ্যালারি মোডাল === */
        .gallery-modal {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: var(--bg);
            display: none;
            flex-direction: column;
        }
        .gallery-modal.open {
            display: flex;
        }
        .gallery-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .gallery-top h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .gallery-grid {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .gallery-item {
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .gallery-item:hover img { transform: scale(1.05); }
        .gallery-item .loc-tag {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 8px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* === পারমিশন স্ক্রিন === */
        .permission-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
        }
        .permission-screen.hidden { display: none; }
        .perm-icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: rgba(232,197,71,0.1);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .perm-icon i {
            font-size: 32px;
            color: var(--accent);
        }
        .perm-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .perm-desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 320px;
        }
        .perm-btn {
            padding: 14px 36px;
            border-radius: 14px;
            border: none;
            background: var(--accent);
            color: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .perm-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .perm-btn:active { transform: scale(0.97); }

        /* === টোস্ট === */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            z-index: 300;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast i { color: var(--accent); }

        /* === ক্যামেরা সুইচ অ্যানিমেশন === */
        .switching-overlay {
            position: absolute;
            inset: 0;
            z-index: 25;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .switching-overlay.active {
            opacity: 1;
        }
        .switching-overlay i {
            font-size: 28px;
            color: var(--accent);
            animation: spinIcon 0.5s linear;
        }
        @keyframes spinIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* স্ক্রলবার */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="bg-pulse"></div>

    <!-- পারমিশন স্ক্রিন -->
    <div class="permission-screen" id="permScreen">
        <div class="perm-icon">
            <i class="fas fa-camera"></i>
        </div>
        <div class="perm-title">Soho Cam</div>
        <p class="perm-desc">
            ক্যামেরা ও লোকেশন পারমিশন দিন ছবি তোলার জন্য। আপনার লাইভ লোকেশন প্রতিটি ছবিতে স্ট্যাম্প হবে।
        </p>
        <button class="perm-btn" id="startBtn" aria-label="ক্যামেরা শুরু করুন">
            <i class="fas fa-power-off"></i>&nbsp; ক্যামেরা চালু করুন
        </button>
    </div>

    <!-- ক্যামেরা কন্টেইনার -->
    <div class="camera-container" id="cameraContainer">
        <!-- টপ বার -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span class="logo-text">SOHO<span class="logo-dot"></span></span>
            </div>
            <div class="top-bar-right">
                <span class="timestamp-badge" id="liveTime">--:--:--</span>
                <div class="gps-badge" id="gpsBadge">
                    <span class="gps-dot"></span>
                    <span id="gpsText">GPS খোঁজা হচ্ছে...</span>
                </div>
            </div>
        </div>

        <!-- ভিডিও -->
        <div class="video-wrapper" id="videoWrapper">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="captureCanvas"></canvas>

            <div class="grid-overlay">
                <div class="h-line"></div>
                <div class="h-line"></div>
                <div class="v-line"></div>
                <div class="v-line"></div>
            </div>

            <div class="focus-ring" id="focusRing"></div>
            <div class="flash-overlay" id="flashOverlay"></div>
            <div class="switching-overlay" id="switchOverlay">
                <i class="fas fa-sync-alt"></i>
            </div>
        </div>

        <!-- লোকেশন ফুটার -->
        <div class="location-footer">
            <div class="location-info">
                <div class="location-icon-wrap">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="location-details">
                    <div class="location-name" id="locName">লোকেশন খোঁজা হচ্ছে...</div>
                    <div class="location-coords" id="locCoords">--.--, --.--</div>
                    <div class="location-accuracy" id="locAccuracy">Accuracy: --</div>
                </div>
            </div>
            <div class="capture-controls">
                <button class="ctrl-btn" id="galleryBtn" aria-label="গ্যালারি">
                    <i class="fas fa-images"></i>
                    <span class="gallery-count" id="galleryCount">0</span>
                </button>
                <button class="shutter-btn" id="shutterBtn" aria-label="ছবি তোলুন"></button>
                <button class="ctrl-btn" id="switchCamBtn" aria-label="ক্যামেরা পাল্টান">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- প্রিভিউ মোডাল -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-top">
            <h3>ক্যাপচার প্রিভিউ</h3>
            <button class="preview-close" id="previewClose" aria-label="বন্ধ করুন"><i class="fas fa-times"></i></button>
        </div>
        <div class="preview-image-wrap">
            <img id="previewImg" src="" alt="ক্যাপচার করা ছবি">
        </div>
        <div class="preview-footer">
            <div class="preview-location">
                <i class="fas fa-map-marker-alt"></i>
                <div class="preview-location-info">
                    <div class="preview-location-name" id="prevLocName">--</div>
                    <div class="preview-location-coords" id="prevLocCoords">--</div>
                    <div class="preview-location-time" id="prevLocTime">--</div>
                </div>
            </div>
            <div class="preview-actions">
                <button class="preview-action-btn btn-download" id="downloadBtn">
                    <i class="fas fa-download"></i> ডাউনলোড
                </button>
                <button class="preview-action-btn btn-share" id="shareBtn">
                    <i class="fas fa-share-alt"></i> শেয়ার
                </button>
            </div>
        </div>
    </div>

    <!-- গ্যালারি মোডাল -->
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-top">
            <h3>গ্যালারি</h3>
            <button class="preview-close" id="galleryClose" aria-label="বন্ধ করুন"><i class="fas fa-times"></i></button>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- টোস্ট -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">ছবি সেভ হয়েছে!</span>
    </div>

    <script>
        // === স্টেট ===
        let currentStream = null;
        let facingMode = 'environment';
        let currentLat = null;
        let currentLon = null;
        let currentAccuracy = null;
        let currentAddress = 'অজানা লোকেশন';
        let photos = [];
        let lastCaptureData = null;
        let watchId = null;

        // === DOM ===
        const permScreen = document.getElementById('permScreen');
        const startBtn = document.getElementById('startBtn');
        const cameraVideo = document.getElementById('cameraVideo');
        const captureCanvas = document.getElementById('captureCanvas');
        const shutterBtn = document.getElementById('shutterBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const galleryBtn = document.getElementById('galleryBtn');
        const galleryCount = document.getElementById('galleryCount');
        const gpsBadge = document.getElementById('gpsBadge');
        const gpsText = document.getElementById('gpsText');
        const liveTime = document.getElementById('liveTime');
        const locName = document.getElementById('locName');
        const locCoords = document.getElementById('locCoords');
        const locAccuracy = document.getElementById('locAccuracy');
        const flashOverlay = document.getElementById('flashOverlay');
        const focusRing = document.getElementById('focusRing');
        const switchOverlay = document.getElementById('switchOverlay');
        const previewModal = document.getElementById('previewModal');
        const previewImg = document.getElementById('previewImg');
        const previewClose = document.getElementById('previewClose');
        const prevLocName = document.getElementById('prevLocName');
        const prevLocCoords = document.getElementById('prevLocCoords');
        const prevLocTime = document.getElementById('prevLocTime');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const galleryModal = document.getElementById('galleryModal');
        const galleryClose = document.getElementById('galleryClose');
        const galleryGrid = document.getElementById('galleryGrid');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const videoWrapper = document.getElementById('videoWrapper');

        // === লাইভ টাইম ===
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            liveTime.textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // === টোস্ট ===
        function showToast(msg, icon = 'fa-check-circle') {
            toastText.textContent = msg;
            toast.querySelector('i').className = `fas ${icon}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // === ক্যামেরা শুরু ===
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                cameraVideo.srcObject = stream;
                await cameraVideo.play();
                permScreen.classList.add('hidden');
                showToast('ক্যামেরা চালু হয়েছে', 'fa-camera');
            } catch (err) {
                console.error('ক্যামেরা এরর:', err);
                showToast('ক্যামেরা পারমিশন দিন', 'fa-exclamation-triangle');
            }
        }

        // === ক্যামেরা সুইচ ===
        async function switchCamera() {
            switchOverlay.classList.add('active');
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            await startCamera();
            setTimeout(() => switchOverlay.classList.remove('active'), 300);
        }

        // === লোকেশন ===
        function startLocation() {
            if (!navigator.geolocation) {
                gpsText.textContent = 'GPS সাপোর্ট নেই';
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                async (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    currentAccuracy = pos.coords.accuracy;

                    // GPS ব্যাজ আপডেট
                    gpsBadge.classList.add('active');
                    gpsText.textContent = 'GPS সক্রিয়';

                    // কোঅর্ডিনেট দেখান
                    locCoords.textContent = `${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}`;
                    locAccuracy.textContent = `Accuracy: ±${Math.round(currentAccuracy)}m`;

                    // রিভার্স জিওকোডিং (বিনামূল্যে Nominatim API)
                    try {
                        const resp = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&accept-language=bn`,
                            { headers: { 'User-Agent': 'SohoCam/1.0' } }
                        );
                        const data = await resp.json();
                        if (data && data.display_name) {
                            const parts = data.display_name.split(',');
                            currentAddress = parts.slice(0, 3).join(',').trim();
                            locName.textContent = currentAddress;
                        }
                    } catch (e) {
                        // অফলাইনে শুধু কোঅর্ডিনেট দেখাবে
                        currentAddress = `${currentLat.toFixed(4)}°N, ${currentLon.toFixed(4)}°E`;
                        locName.textContent = currentAddress;
                    }
                },
                (err) => {
                    console.warn('লোকেশন এরর:', err);
                    gpsText.textContent = 'GPS পাওয়া যায়নি';
                    gpsBadge.classList.remove('active');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 5000
                }
            );
        }

        // === ছবি ক্যাপচার ===
        function capturePhoto() {
            // ফ্ল্যাশ
            flashOverlay.classList.add('flash');
            setTimeout(() => flashOverlay.classList.remove('flash'), 150);

            const vw = cameraVideo.videoWidth;
            const vh = cameraVideo.videoHeight;
            captureCanvas.width = vw;
            captureCanvas.height = vh;

            const ctx = captureCanvas.getContext('2d');

            // ভিডিও ফ্রেম আঁকুন
            ctx.drawImage(cameraVideo, 0, 0, vw, vh);

            // লোকেশন স্ট্যাম্প ছবির উপরে
            const now = new Date();
            const dateStr = now.toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const coordStr = currentLat && currentLon ? `${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}` : 'GPS পাওয়া যায়নি';

            // স্ট্যাম্প ব্যাকগ্রাউন্ড
            const stampH = Math.max(60, vh * 0.08);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(0, vh - stampH, vw, stampH);

            // অ্যাকসেন্ট লাইন
            ctx.fillStyle = '#e8c547';
            ctx.fillRect(0, vh - stampH, vw, 3);

            // টেক্সট
            const fontSize = Math.max(14, Math.round(vw * 0.022));
            const smallFont = Math.max(10, Math.round(vw * 0.016));
            ctx.font = `600 ${fontSize}px 'Space Grotesk', sans-serif`;
            ctx.fillStyle = '#f0ece4';
            ctx.textBaseline = 'middle';

            const padX = Math.round(vw * 0.03);
            const centerY = vh - stampH / 2;

            // লোকেশন নাম
            ctx.fillText(currentAddress, padX, centerY - fontSize * 0.4);

            // কোঅর্ডিনেট ও সময়
            ctx.font = `400 ${smallFont}px 'JetBrains Mono', monospace`;
            ctx.fillStyle = '#e8c547';
            ctx.fillText(`${coordStr}  |  ${dateStr} ${timeStr}`, padX, centerY + fontSize * 0.6);

            // SOHO ওয়াটারমার্ক
            ctx.font = `700 ${Math.max(12, Math.round(vw * 0.018))}px 'Space Grotesk', sans-serif`;
            ctx.fillStyle = 'rgba(232, 197, 71, 0.7)';
            ctx.textAlign = 'right';
            ctx.fillText('SOHO CAM', vw - padX, centerY);
            ctx.textAlign = 'left';

            // ডেটা URL
            const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.92);

            const photoData = {
                src: dataUrl,
                lat: currentLat,
                lon: currentLon,
                accuracy: currentAccuracy,
                address: currentAddress,
                date: dateStr,
                time: timeStr,
                timestamp: now.getTime()
            };

            photos.push(photoData);
            lastCaptureData = photoData;

            // গ্যালারি কাউন্ট
            galleryCount.textContent = photos.length;
            galleryCount.classList.add('show');

            // প্রিভিউ দেখান
            showPreview(photoData);

            showToast('ছবি ক্যাপচার হয়েছে!', 'fa-camera');
        }

        // === প্রিভিউ ===
        function showPreview(data) {
            previewImg.src = data.src;
            prevLocName.textContent = data.address;
            prevLocCoords.textContent = data.lat && data.lon
                ? `${data.lat.toFixed(6)}, ${data.lon.toFixed(6)}`
                : 'GPS ডেটা নেই';
            prevLocTime.textContent = `${data.date} ${data.time}`;
            previewModal.classList.add('open');
        }

        previewClose.addEventListener('click', () => {
            previewModal.classList.remove('open');
        });

        // === ডাউনলোড ===
        downloadBtn.addEventListener('click', () => {
            if (!lastCaptureData) return;
            const a = document.createElement('a');
            a.href = lastCaptureData.src;
            const ts = new Date(lastCaptureData.timestamp);
            a.download = `soho_cam_${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}_${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}${String(ts.getSeconds()).padStart(2,'0')}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('ছবি ডাউনলোড হচ্ছে', 'fa-download');
        });

        // === শেয়ার ===
        shareBtn.addEventListener('click', async () => {
            if (!lastCaptureData) return;
            try {
                const blob = await (await fetch(lastCaptureData.src)).blob();
                const file = new File([blob], 'soho_cam_photo.jpg', { type: 'image/jpeg' });
                if (navigator.share) {
                    await navigator.share({
                        title: 'Soho Cam Photo',
                        text: `${lastCaptureData.address}\n${lastCaptureData.lat?.toFixed(6)}, ${lastCaptureData.lon?.toFixed(6)}`,
                        files: [file]
                    });
                } else {
                    // শেয়ার API না থাকলে কপি
                    const text = `Soho Cam | ${lastCaptureData.address} | ${lastCaptureData.lat?.toFixed(6)}, ${lastCaptureData.lon?.toFixed(6)}`;
                    await navigator.clipboard.writeText(text);
                    showToast('লোকেশন কপি হয়েছে', 'fa-copy');
                }
            } catch (e) {
                console.log('শেয়ার বাতিল হয়েছে');
            }
        });

        // === গ্যালারি ===
        galleryBtn.addEventListener('click', () => {
            renderGallery();
            galleryModal.classList.add('open');
        });
        galleryClose.addEventListener('click', () => {
            galleryModal.classList.remove('open');
        });

        function renderGallery() {
            galleryGrid.innerHTML = '';
            if (photos.length === 0) {
                galleryGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:14px;">এখনো কোনো ছবি নেই</p>';
                return;
            }
            // সর্বশেষ আগে
            const reversed = [...photos].reverse();
            reversed.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${p.src}" alt="ছবি ${photos.length - i}" loading="lazy">
                    <div class="loc-tag"><i class="fas fa-map-marker-alt"></i>${p.address.substring(0, 15)}...</div>
                `;
                div.addEventListener('click', () => {
                    galleryModal.classList.remove('open');
                    showPreview(p);
                    lastCaptureData = p;
                });
                galleryGrid.appendChild(div);
            });
        }

        // === ফোকাস রিং ===
        videoWrapper.addEventListener('click', (e) => {
            const rect = videoWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            focusRing.style.left = (x - 35) + 'px';
            focusRing.style.top = (y - 35) + 'px';
            focusRing.classList.add('show');
            setTimeout(() => focusRing.classList.remove('show'), 800);
        });

        // === ইভেন্ট লিসেনার ===
        startBtn.addEventListener('click', () => {
            startCamera();
            startLocation();
        });

        shutterBtn.addEventListener('click', capturePhoto);
        switchCamBtn.addEventListener('click', switchCamera);

        // কীবোর্ড শর্টকাট
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !previewModal.classList.contains('open') && !galleryModal.classList.contains('open')) {
                e.preventDefault();
                capturePhoto();
            }
            if (e.code === 'Escape') {
                previewModal.classList.remove('open');
                galleryModal.classList.remove('open');
            }
        });

        // ভলিউম বাটন দিয়ে ছবি তোলা (মোবাইল)
        let lastVolume = null;
        document.addEventListener('volumechange', () => {});

    </script>
</body>
</html>
