<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--bg:#0a0f1a;--bg2:#111827;--card:#151f30;--card2:#1a2740;--accent:#00d4aa;--accent2:#00f0c0;--accent-dim:#00a88a;--warn:#f59e0b;--danger:#ef4444;--text:#e8edf5;--text2:#8899b0;--muted:#4a5a72;--border:#1e2e44;--border2:#2a3d58}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-dim)}
.view{display:none;min-height:100vh}.view.active{display:flex}
#loginView{align-items:center;justify-content:center;position:relative}
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.15;animation:blobMove 20s ease-in-out infinite}
.blob:nth-child(1){width:500px;height:500px;background:var(--accent);top:-10%;left:-10%}
.blob:nth-child(2){width:400px;height:400px;background:#f59e0b;bottom:-10%;right:-10%;animation-delay:-7s}
.blob:nth-child(3){width:300px;height:300px;background:#ef4444;top:50%;left:50%;animation-delay:-14s}
@keyframes blobMove{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-80px) scale(1.1)}50%{transform:translate(-60px,40px) scale(.9)}75%{transform:translate(30px,60px) scale(1.05)}}
.login-card{background:rgba(21,31,48,.85);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:420px;max-width:92vw;position:relative;z-index:1;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.login-card h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.login-card p{color:var(--text2);font-size:14px;margin-top:4px}
.login-input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border .3s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border:none;border-radius:12px;color:#0a0f1a;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;margin-top:8px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,170,.3)}
.login-btn:active{transform:translateY(0)}
.dash-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.dash-header .logo-text{font-size:18px;font-weight:700;color:var(--accent)}
.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;overflow-y:auto;min-height:calc(100vh - 60px)}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--text2);cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(0,212,170,.05);color:var(--text)}
.sidebar-item.active{background:rgba(0,212,170,.08);color:var(--accent);border-left-color:var(--accent)}
.sidebar-item i{width:20px;text-align:center;font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:all .3s}
.card:hover{border-color:var(--border2)}
.stat-card{position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08}
.stat-card.green::after{background:var(--accent)}
.stat-card.amber::after{background:var(--warn)}
.stat-card.red::after{background:var(--danger)}
.stat-card.blue::after{background:#3b82f6}
.data-table{width:100%;border-collapse:separate;border-spacing:0}
.data-table th{background:var(--bg2);color:var(--text2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.data-table tr:hover td{background:rgba(0,212,170,.03)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-size:12px;font-weight:700}
.badge.P{background:rgba(0,212,170,.15);color:#00d4aa}
.badge.A{background:rgba(239,68,68,.15);color:#ef4444}
.badge.T{background:rgba(59,130,246,.15);color:#60a5fa}
.badge.L{background:rgba(245,158,11,.15);color:#f59e0b}
.badge.H{background:rgba(168,85,247,.15);color:#a855f7}
.badge.small{width:26px;height:26px;font-size:11px;border-radius:6px}
.badge.mini{width:22px;height:22px;font-size:10px;border-radius:5px}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#0a0f1a}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.15);color:#ef4444}.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-warn{background:rgba(245,158,11,.15);color:#f59e0b}.btn-warn:hover{background:rgba(245,158,11,.25)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:6px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .3s}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-select option{background:var(--bg2);color:var(--text)}
.status-btn{width:56px;height:56px;border-radius:14px;border:2px solid var(--border);background:var(--bg);color:var(--text2);font-size:16px;font-weight:800;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.status-btn span{font-size:9px;font-weight:500;letter-spacing:.3px}
.status-btn:hover{border-color:var(--muted);transform:translateY(-2px)}
.status-btn.selected-P{border-color:#00d4aa;background:rgba(0,212,170,.1);color:#00d4aa}
.status-btn.selected-A{border-color:#ef4444;background:rgba(239,68,68,.1);color:#ef4444}
.status-btn.selected-T{border-color:#60a5fa;background:rgba(59,130,246,.1);color:#60a5fa}
.status-btn.selected-L{border-color:#f59e0b;background:rgba(245,158,11,.1);color:#f59e0b}
.status-btn.selected-H{border-color:#a855f7;background:rgba(168,85,247,.1);color:#a855f7}
.status-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 20px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn .4s ease;min-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.success{background:rgba(0,212,170,.15);border:1px solid rgba(0,212,170,.3);color:#00f0c0}
.toast.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.toast.info{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93bbfd}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(100px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:32px;max-width:560px;width:100%;animation:modalIn .3s ease;max-height:90vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.active-badge{background:rgba(0,212,170,.12);color:#00d4aa;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.inactive-badge{background:rgba(239,68,68,.12);color:#ef4444;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.holiday-badge{background:rgba(168,85,247,.12);color:#a855f7;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.pending-badge{background:rgba(245,158,11,.12);color:#f59e0b;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.approved-badge{background:rgba(0,212,170,.12);color:#00d4aa;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.desig-group-row td{background:var(--bg2)!important;font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.5px;padding:10px 14px!important;border-bottom:2px solid var(--accent-dim)!important}
#printArea{display:none}
@media print{
body>*{display:none!important}
#printArea{display:block!important;padding:20px;font-family:'Outfit',sans-serif;color:#111}
#printArea table{width:100%;border-collapse:collapse;font-size:9px}
#printArea th,#printArea td{border:1px solid #333;padding:3px 5px;text-align:center}
#printArea th{background:#e5e7eb;font-weight:700;font-size:8px}
#printArea h2{text-align:center;font-size:14px;margin-bottom:4px}
#printArea h3{text-align:center;font-size:11px;color:#555;margin-bottom:10px}
#printArea .desig-group-row td{background:#d1fae5!important;font-weight:800;font-size:9px;color:#065f46;border-bottom:2px solid #059669!important}
@page{size:landscape;margin:6mm}
}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fadeIn .4s ease both}
.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.15s}
.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.25s}
.stagger>*:nth-child(6){animation-delay:.3s}
@media(max-width:768px){
.sidebar{width:60px;padding:10px 0}
.sidebar-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent;font-size:0}
.sidebar-item i{font-size:18px}
.sidebar-item span{display:none}
.sidebar-item.active{border-bottom-color:var(--accent);border-left-color:transparent}
.login-card{padding:32px 24px}
.dash-header{padding:12px 16px}
}
.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer;display:inline-block;vertical-align:middle}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--danger);border-radius:24px;transition:.3s}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
</style>
</head>
<body>
<div class="bg-blobs"><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>
<div class="toast-container" id="toastBox"></div>
<div id="modalOverlay" style="display:none"></div>

<div id="loginView" class="view active">
<div class="login-card fade-in">
<div class="flex items-center gap-3 mb-1">
<div style="width:44px;height:44px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center">
<i class="fa-solid fa-clipboard-check" style="color:#0a0f1a;font-size:20px"></i>
</div>
<div><h1>Attendance System</h1><p>Kushtia Depot</p></div>
</div>
<div style="height:1px;background:var(--border);margin:24px 0"></div>
<div class="form-group"><label class="form-label">User ID</label><input class="login-input" id="loginId" placeholder="Enter your ID" autocomplete="off"></div>
<div class="form-group"><label class="form-label">Password</label><input class="login-input" id="loginPass" type="password" placeholder="Enter password"></div>
<button class="login-btn" onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
<p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)"><i class="fa-solid fa-shield-halved"></i> Secure Attendance Management</p>
</div>
</div>

<div id="userView" class="view" style="flex-direction:column">
<header class="dash-header">
<div class="flex items-center gap-3"><i class="fa-solid fa-clipboard-check" style="color:var(--accent);font-size:20px"></i><span class="logo-text">Attendance System</span></div>
<div class="flex items-center gap-4"><span id="userDisplayId" style="font-size:14px;color:var(--text2)"></span><button class="btn btn-sm btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-sign-out"></i> Logout</button></div>

<div class="flex items-center gap-4"><span id="dicDisplayId" style="font-size:14px;color:var(--text2)"></span><button class="btn btn-sm btn-secondary" onclick="handleLogout()"><i class="fa-solid fa-sign-out"></i> Logout</button></div>
</header>

</div>
</div>

<div id="printArea"></div>

<script>
var DIC_ID='KUS-11182401',DIC_PASS='KUS-11182401',DB_URL='https://attendance-kushtia-default-rtdb.europe-west1.firebasedatabase.app';
var firebaseConfig={apiKey:"AIzaSyBEg0R0YOOsFgKiyTv3QkyQv0Vhpym1lms",authDomain:"attendance-kushtia.firebaseapp.com",databaseURL:DB_URL,projectId:"attendance-kushtia",storageBucket:"attendance-kushtia.firebasestorage.app",messagingSenderId:"695383066612",appId:"1:695383066612:web:0d9f5a6dc5d1bbd0a6dba1",measurementId:"G-G21R0GPT2X"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

var currentUser=null,allUsers={},allHolidays={},currentTab='overview',selectedStatus='',dicEntryStatus='',lastReportHTML='',lastSalaryHTML='';

/* Designation order for grouping */
var DESIG_ORDER=['Depot In-Charge','Asst. Depot In-Charge','Delivery Assistant','Driver','Helper'];
var DESIGNATIONS=DESIG_ORDER;

function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function firstDayOfMonth(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function formatBD(ds){if(!ds)return'';var d=new Date(ds+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function statusLabel(s){return{P:'Present',A:'Absent',T:'Tour',L:'Leave',H:'Holiday'}[s]||s}
function statusColor(s){return{P:'#00d4aa',A:'#ef4444',T:'#60a5fa',L:'#f59e0b',H:'#a855f7'}[s]||'#666'}
function monthName(m){return['January','February','March','April','May','June','July','August','September','October','November','December'][m]}
function isHoliday(ds){return allHolidays.hasOwnProperty(ds)}
function getAttStatus(ds,uid,att){if(att&&att.status)return att.status;if(isHoliday(ds))return'H';return''}
function desigOrder(d){var i=DESIG_ORDER.indexOf(d);return i===-1?99:i}

function showToast(msg,type){type=type||'info';var box=document.getElementById('toastBox'),icons={success:'fa-check-circle',error:'fa-times-circle',info:'fa-info-circle'};var t=document.createElement('div');t.className='toast '+type;t.innerHTML='<i class="fa-solid '+(icons[type]||icons.info)+'"></i><span>'+msg+'</span>';box.appendChild(t);setTimeout(function(){t.classList.add('out');setTimeout(function(){t.remove()},300)},3500)}

function showModal(title,bodyHTML,onConfirm){var ov=document.getElementById('modalOverlay');ov.style.display='flex';var btnHTML=onConfirm?'<button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>':'';ov.innerHTML='<div class="modal-box"><h3 style="font-size:18px;font-weight:700;margin-bottom:16px">'+title+'</h3><div>'+bodyHTML+'</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'+btnHTML+'</div></div>';if(onConfirm)document.getElementById('modalConfirmBtn').onclick=function(){onConfirm();closeModal()};ov.onclick=function(e){if(e.target===ov)closeModal()}}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}
function switchView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});document.getElementById(id).classList.add('active')}

function dateRange(fromStr,toStr){var dates=[];var cur=new Date(fromStr+'T00:00:00'),end=new Date(toStr+'T00:00:00');while(cur<=end){dates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));cur.setDate(cur.getDate()+1)}return dates}

async function loadUsers(){try{var snap=await db.ref('users').once('value');allUsers=snap.val()||{}}catch(e){showToast('Failed to load users','error')}}
async function loadHolidays(){try{var snap=await db.ref('holidays').once('value');allHolidays=snap.val()||{}}catch(e){showToast('Failed to load holidays','error')}}

/* LOGIN */
async function handleLogin(){var id=document.getElementById('loginId').value.trim(),pass=document.getElementById('loginPass').value.trim();if(!id||!pass){showToast('Enter ID and Password','error');return}if(id===DIC_ID&&pass===DIC_PASS){var snap=await db.ref('users/'+DIC_ID).once('value');if(!snap.exists())await db.ref('users/'+DIC_ID).set({id:DIC_ID,name:'Depot Incharge',designation:'Depot In-Charge',depot:'Kushtia',joinDate:todayStr(),salary:0,mobile:'',role:'DIC',password:DIC_PASS,active:true,createdAt:Date.now()});currentUser={id:DIC_ID,name:'Depot Incharge',role:'DIC'};await loadUsers();await loadHolidays();document.getElementById('dicDisplayId').textContent=DIC_ID;switchView('dicView');renderSidebar();showTab('overview');showToast('Welcome, Depot Incharge','success');return}try{var snap=await db.ref('users/'+id).once('value');if(!snap.exists()){showToast('User not found','error');return}var data=snap.val();if(data.password!==pass){showToast('Wrong password','error');return}if(data.active===false){showToast('Account deactivated','error');return}currentUser=data;await loadHolidays();document.getElementById('userDisplayId').textContent=id;switchView('userView');renderUserDashboard();showToast('Welcome, '+data.name,'success')}catch(e){showToast('Login error','error')}}
function handleLogout(){currentUser=null;allUsers={};allHolidays={};document.getElementById('loginId').value='';document.getElementById('loginPass').value='';switchView('loginView');showToast('Logged out','info')}

async function generateReport(){
  var m=parseInt(document.getElementById('repMonth').value),y=parseInt(document.getElementById('repYear').value),days=getDaysInMonth(y,m);
  var users=Object.entries(allUsers).filter(function(e){return e[1].role!=='DIC'&&e[1].active!==false}).sort(function(a,b){return a[1].name.localeCompare(b[1].name)});
  if(users.length===0){showToast('No active users','error');return}

  /* Load full month */
  var allAtt={};
  for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var snap=await db.ref('attendance/'+ds).once('value');allAtt[ds]=snap.val()||{}}

  /* Group users by designation */
  var groups={};
  for(var i=0;i<users.length;i++){
    var uid=users[i][0],u=users[i][1];
    var desig=u.designation||'Other';
    if(!groups[desig])groups[desig]=[];
    groups[desig].push({uid:uid,u:u});
  }

  /* Sort groups by designation order */
  var sortedGroupKeys=Object.keys(groups).sort(function(a,b){return desigOrder(a)-desigOrder(b)});

  /* Build grid header */
  var headerCells='<th style="min-width:140px;text-align:left">Name</th><th style="min-width:90px;text-align:left;font-size:10px">Designation</th>';
  for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var hol=isHoliday(ds);headerCells+='<th style="min-width:28px;'+(hol?'background:rgba(168,85,247,.1);color:#a855f7':'')+'" title="'+formatBD(ds)+'">'+d+'</th>'}
  headerCells+='<th>P</th><th>A</th><th>T</th><th>L</th><th>H</th>';

  var bodyRows='',approvedList=[];

  for(var gi=0;gi<sortedGroupKeys.length;gi++){
    var desig=sortedGroupKeys[gi];
    var groupUsers=groups[desig];

    /* Designation header row */
    bodyRows+='<tr class="desig-group-row"><td colspan="'+(3+days+5)+'"><i class="fa-solid fa-user-tie" style="margin-right:8px"></i>'+desig+' ('+groupUsers.length+' person)</td></tr>';

    for(var ui=0;ui<groupUsers.length;ui++){
      var uid=groupUsers[ui].uid,u=groupUsers[ui].u;
      var cells='<td style="font-weight:600;text-align:left">'+u.name+'</td><td style="text-align:left;font-size:10px;color:var(--text2)">'+(u.designation||'')+'</td>';
      var counts={P:0,A:0,T:0,L:0,H:0};
      for(var d=1;d<=days;d++){
        var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        var attData=allAtt[ds][uid],s=getAttStatus(ds,uid,attData);
        if(s&&counts.hasOwnProperty(s))counts[s]++;
        var hol=isHoliday(ds);
        cells+='<td style="'+(hol?'background:rgba(168,85,247,.04)':'')+'">'+(s?'<span class="badge mini '+s+'">'+s+'</span>':'')+'</td>';
        if(attData&&attData.approved)approvedList.push({date:ds,uid:uid,name:u.name,designation:u.designation||'',depot:u.depot||'',status:attData.status})
      }
      cells+='<td style="font-weight:700;color:#00d4aa;font-size:12px">'+counts.P+'</td><td style="font-weight:700;color:#ef4444;font-size:12px">'+counts.A+'</td><td style="font-weight:700;color:#60a5fa;font-size:12px">'+counts.T+'</td><td style="font-weight:700;color:#f59e0b;font-size:12px">'+counts.L+'</td><td style="font-weight:700;color:#a855f7;font-size:12px">'+counts.H+'</td>';
      bodyRows+='<tr>'+cells+'</tr>';
    }
  }

  /* Holiday legend */
  var holidayList='';
  for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(isHoliday(ds))holidayList+='<span class="holiday-badge" style="margin:2px">'+d+': '+allHolidays[ds]+'</span> '}

  var tableHTML=(holidayList?'<div style="margin-bottom:12px">'+holidayList+'</div>':'')+'<table class="data-table" id="reportTable"><thead><tr>'+headerCells+'</tr></thead><tbody>'+bodyRows+'</tbody></table>';
  document.getElementById('reportArea').innerHTML=tableHTML;
  document.getElementById('printReportBtn').style.display='inline-flex';

  /* Approved list */
  approvedList.sort(function(a,b){return a.date.localeCompare(b.date)||a.name.localeCompare(b.name)});
  var approvedRows='';
  for(var i=0;i<approvedList.length;i++){var p=approvedList[i];approvedRows+='<tr><td>'+formatBD(p.date)+'</td><td style="font-weight:600">'+p.name+'</td><td style="font-size:11px;color:var(--text2)">'+p.designation+'</td><td style="font-size:11px;color:var(--text2)">'+p.depot+'</td><td><span class="badge '+p.status+'">'+p.status+'</span> '+statusLabel(p.status)+'</td><td><span class="approved-badge">Approved</span></td></tr>'}
  if(approvedList.length>0){document.getElementById('reportApprovedArea').style.display='block';document.getElementById('approvedListArea').innerHTML='<div style="margin-bottom:12px;font-size:13px;color:var(--text2)">Total Approved: <strong style="color:var(--accent)">'+approvedList.length+'</strong></div><table class="data-table"><thead><tr><th>Date</th><th>Name</th><th>Designation</th><th>Depot</th><th>Status</th><th>Approval</th></tr></thead><tbody>'+approvedRows+'</tbody></table>'}
  else{document.getElementById('reportApprovedArea').style.display='block';document.getElementById('approvedListArea').innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">No approved entries</div>'}

  /* Print HTML with designation groups */
  var phCells='<th>Name</th><th>Desig.</th>';
  for(var d=1;d<=days;d++)phCells+='<th>'+d+'</th>';
  phCells+='<th>P</th><th>A</th><th>T</th><th>L</th><th>H</th>';
  var pbRows='';
  for(var gi=0;gi<sortedGroupKeys.length;gi++){
    var desig=sortedGroupKeys[gi],groupUsers=groups[desig];
    pbRows+='<tr class="desig-group-row"><td colspan="'+(2+days+5)+'" style="text-align:left">'+desig+'</td></tr>';
    for(var ui=0;ui<groupUsers.length;ui++){
      var uid=groupUsers[ui].uid,u=groupUsers[ui].u;
      var cells='<td style="text-align:left">'+u.name+'</td><td>'+(u.designation||'')+'</td>';
      var counts={P:0,A:0,T:0,L:0,H:0};
      for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var s=getAttStatus(ds,uid,allAtt[ds][uid]);if(s&&counts.hasOwnProperty(s))counts[s]++;cells+='<td style="color:'+statusColor(s)+';font-weight:700">'+(s||'')+'</td>'}
      cells+='<td>'+counts.P+'</td><td>'+counts.A+'</td><td>'+counts.T+'</td><td>'+counts.L+'</td><td>'+counts.H+'</td>';
      pbRows+='<tr>'+cells+'</tr>'
    }
  }
  lastReportHTML='<h2>ATTENDANCE REPORT - '+monthName(m).toUpperCase()+' '+y+'</h2><h3>Kushtia Depot</h3><table><thead><tr>'+phCells+'</tr></thead><tbody>'+pbRows+'</tbody></table><p style="margin-top:10px;font-size:9px;color:#888">Generated: '+new Date().toLocaleString()+'</p>'
}
function printReport(){if(!lastReportHTML){showToast('Generate first','error');return}document.getElementById('printArea').innerHTML=lastReportHTML;setTimeout(function(){window.print()},200)}

/* DIC SALARY SHEET */
async function renderSalary(){await loadUsers();var now=new Date(),monthOpts='',yearOpts='';for(var i=0;i<12;i++)monthOpts+='<option value="'+i+'"'+(i===now.getMonth()?' selected':'')+'>'+monthName(i)+'</option>';for(var i=0;i<5;i++){var yr=now.getFullYear()-2+i;yearOpts+='<option value="'+yr+'"'+(yr===now.getFullYear()?' selected':'')+'>'+yr+'</option>'}document.getElementById('dicContent').innerHTML='<div class="fade-in"><h2 style="font-size:22px;font-weight:800;margin-bottom:20px">Salary Sheet</h2><div style="display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:20px"><div class="form-group" style="margin:0;min-width:150px"><label class="form-label">Month</label><select class="form-select" id="salMonth">'+monthOpts+'</select></div><div class="form-group" style="margin:0;min-width:120px"><label class="form-label">Year</label><select class="form-select" id="salYear">'+yearOpts+'</select></div><button class="btn btn-primary" onclick="generateSalarySheet()"><i class="fa-solid fa-calculator"></i> Generate</button><button class="btn btn-secondary" id="printSalBtn" onclick="printSalary()" style="display:none"><i class="fa-solid fa-print"></i> Print</button></div><div class="card"><div style="overflow-x:auto" id="salaryArea"><div style="text-align:center;padding:40px;color:var(--muted)">Select month & year and click Generate</div></div></div></div>'}

async function generateSalarySheet(){var m=parseInt(document.getElementById('salMonth').value),y=parseInt(document.getElementById('salYear').value),days=getDaysInMonth(y,m);var users=Object.entries(allUsers).filter(function(e){return e[1].active!==false&&e[1].salary>0}).sort(function(a,b){return desigOrder(a[1].designation)-desigOrder(b[1].designation)||a[1].name.localeCompare(b[1].name)});if(users.length===0){document.getElementById('salaryArea').innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">No users with salary. Set in Manage Users.</div>';showToast('No salary data','error');return}var allAtt={};for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var snap=await db.ref('attendance/'+ds).once('value');allAtt[ds]=snap.val()||{}}var rows='',totalBasic=0,totalDeduct=0,totalNet=0,curDesig='';for(var i=0;i<users.length;i++){var uid=users[i][0],u=users[i][1];if(u.designation!==curDesig){curDesig=u.designation||'Other';rows+='<tr class="desig-group-row"><td colspan="12"><i class="fa-solid fa-user-tie" style="margin-right:8px"></i>'+curDesig+'</td></tr>'}var counts={P:0,A:0,T:0,L:0,H:0};for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var s=getAttStatus(ds,uid,allAtt[ds][uid]);if(s&&counts.hasOwnProperty(s))counts[s]++}var basic=u.salary,deduct=Math.round((basic/days)*counts.A),net=basic-deduct;totalBasic+=basic;totalDeduct+=deduct;totalNet+=net;rows+='<tr><td style="font-weight:600">'+u.name+'</td><td style="font-size:11px;color:var(--text2)">'+(u.designation||'')+'</td><td style="font-size:11px;color:var(--text2)">'+(u.depot||'')+'</td><td style="font-weight:600;color:var(--accent)">৳'+basic.toLocaleString()+'</td><td style="color:#00d4aa;font-weight:700">'+counts.P+'</td><td style="color:#ef4444;font-weight:700">'+counts.A+'</td><td style="color:#60a5fa;font-weight:700">'+counts.T+'</td><td style="color:#f59e0b;font-weight:700">'+counts.L+'</td><td style="color:#a855f7;font-weight:700">'+counts.H+'</td><td style="font-weight:600">'+days+'</td><td style="color:#ef4444;font-weight:700">৳'+deduct.toLocaleString()+'</td><td style="color:var(--accent);font-weight:800;font-size:14px">৳'+net.toLocaleString()+'</td></tr>'}document.getElementById('salaryArea').innerHTML='<table class="data-table"><thead><tr><th>Name</th><th>Designation</th><th>Depot</th><th>Basic (৳)</th><th>Present</th><th>Absent</th><th>Tour</th><th>Leave</th><th>Holiday</th><th>Days</th><th>Deduction (৳)</th><th>Net Salary (৳)</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr style="font-weight:800;border-top:2px solid var(--border2)"><td colspan="3" style="text-align:right;color:var(--text2)">TOTAL</td><td style="color:var(--accent)">৳'+totalBasic.toLocaleString()+'</td><td></td><td></td><td></td><td></td><td></td><td></td><td style="color:#ef4444">৳'+totalDeduct.toLocaleString()+'</td><td style="color:var(--accent);font-size:15px">৳'+totalNet.toLocaleString()+'</td></tr></tfoot></table><p style="margin-top:16px;font-size:12px;color:var(--text2)"><i class="fa-solid fa-info-circle" style="color:var(--accent)"></i> Deduction = (Basic / '+days+') &times; Absent. Tour, Leave & Holiday paid.</p>';document.getElementById('printSalBtn').style.display='inline-flex';var printRows='';curDesig='';for(var i=0;i<users.length;i++){var uid=users[i][0],u=users[i][1];if(u.designation!==curDesig){curDesig=u.designation||'Other';printRows+='<tr class="desig-group-row"><td colspan="12" style="text-align:left">'+curDesig+'</td></tr>'}var counts={P:0,A:0,T:0,L:0,H:0};for(var d=1;d<=days;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var s=getAttStatus(ds,uid,allAtt[ds][uid]);if(s&&counts.hasOwnProperty(s))counts[s]++}var basic=u.salary,deduct=Math.round((basic/days)*counts.A),net=basic-deduct;printRows+='<tr><td style="text-align:left">'+u.name+'</td><td>'+(u.designation||'')+'</td><td>'+(u.depot||'')+'</td><td>'+basic.toLocaleString()+'</td><td>'+counts.P+'</td><td>'+counts.A+'</td><td>'+counts.T+'</td><td>'+counts.L+'</td><td>'+counts.H+'</td><td>'+days+'</td><td>'+deduct.toLocaleString()+'</td><td>'+net.toLocaleString()+'</td></tr>'}lastSalaryHTML='<h2>SALARY SHEET - '+monthName(m).toUpperCase()+' '+y+'</h2><h3>Kushtia Depot | Days: '+days+'</h3><table><thead><tr><th>Name</th><th>Desig.</th><th>Depot</th><th>Basic</th><th>P</th><th>A</th><th>T</th><th>L</th><th>H</th><th>Days</th><th>Deduct</th><th>Net</th></tr></thead><tbody>'+printRows+'</tbody><tfoot><tr style="font-weight:bold;border-top:2px solid #333"><td colspan="3" style="text-align:right">TOTAL</td><td>'+totalBasic.toLocaleString()+'</td><td></td><td></td><td></td><td></td><td></td><td></td><td>'+totalDeduct.toLocaleString()+'</td><td>'+totalNet.toLocaleString()+'</td></tr></tfoot></table><p style="margin-top:10px;font-size:9px;color:#666">Generated: '+new Date().toLocaleString()+'</p>'}
function printSalary(){if(!lastSalaryHTML){showToast('Generate first','error');return}document.getElementById('printArea').innerHTML=lastSalaryHTML;setTimeout(function(){window.print()},200)}

/* DIC HOLIDAYS */
async function renderHolidays(){await loadHolidays();var sorted=Object.entries(allHolidays).sort(function(a,b){return a[0].localeCompare(b[0])}),listHTML='';if(sorted.length===0){listHTML='<div style="text-align:center;padding:30px;color:var(--muted)">No holidays added yet</div>'}else{var rh='';for(var i=0;i<sorted.length;i++){var d=sorted[i][0],n=sorted[i][1],dayName=new Date(d+'T00:00:00').toLocaleDateString('en',{weekday:'long'});rh+='<tr><td style="font-weight:600">'+formatBD(d)+'</td><td style="color:var(--text2);font-size:12px">'+dayName+'</td><td><span class="holiday-badge">'+n+'</span></td><td><button class="btn btn-xs btn-danger" onclick="removeHoliday(\''+d+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>'}listHTML='<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Date</th><th>Day</th><th>Holiday</th><th>Action</th></tr></thead><tbody>'+rh+'</tbody></table></div>'}document.getElementById('dicContent').innerHTML='<div class="fade-in"><h2 style="font-size:22px;font-weight:800;margin-bottom:20px">Manage Holidays</h2><div class="card" style="margin-bottom:20px"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Add Holiday</h3><div style="display:flex;gap:14px;align-items:end;flex-wrap:wrap"><div class="form-group" style="margin:0;min-width:180px"><label class="form-label">Date</label><input type="date" class="form-input" id="holDate"></div><div class="form-group" style="margin:0;min-width:250px"><label class="form-label">Holiday Name</label><input class="form-input" id="holName" placeholder="e.g. Independence Day"></div><button class="btn btn-primary" onclick="addHoliday()"><i class="fa-solid fa-plus"></i> Add</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="font-size:16px;font-weight:700">Holiday List ('+sorted.length+')</h3><button class="btn btn-sm btn-danger" onclick="clearAllHolidays()"' +(sorted.length===0?' disabled':'')+'><i class="fa-solid fa-trash"></i> Clear All</button></div>'+listHTML+'</div></div>'}
async function addHoliday(){var date=document.getElementById('holDate').value,name=document.getElementById('holName').value.trim();if(!date||!name){showToast('Date and name required','error');return}await db.ref('holidays/'+date).set(name);allHolidays[date]=name;showToast('Added','success');renderHolidays()}
async function removeHoliday(date){await db.ref('holidays/'+date).remove();delete allHolidays[date];showToast('Removed','info');renderHolidays()}
function clearAllHolidays(){showModal('Clear All','<p style="color:var(--text2)">Remove ALL holidays?</p>',async function(){await db.ref('holidays').remove();allHolidays={};showToast('Cleared','info');renderHolidays()})}

document.addEventListener('DOMContentLoaded',function(){document.getElementById('loginId').focus()});
</script>
</body>
