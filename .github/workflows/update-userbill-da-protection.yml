name: Patch userbill DA protection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch userbill.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('userbill.html')
          s = p.read_text(encoding='utf-8')
          old = s

          helper = r'''\nfunction isUserActiveForLogin(u){\n    return !!u && !(u.active===false || u.status==='inactive' || u.status==='deactivated' || u.deactivated===true);\n}\nfunction blockIfDeactivatedUser(){\n    if(currentUser && currentUser.role==='user' && !isUserActiveForLogin(currentUser)){\n        alert('এই DA ID Deactive করা হয়েছে। নতুন Bill/Entry দেওয়া যাবে না।');\n        return true;\n    }\n    return false;\n}\nfunction startDAStatusWatcher(){\n    if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}\n    if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;\n    window.__daStatusWatcher=database.ref('Users/'+currentUser.id);\n    window.__daStatusWatcher.on('value',function(snap){\n        var u=snap.val(),active=isUserActiveForLogin(u);\n        currentUser.active=active;\n        currentUser.status=active?'active':'deactivated';\n        if(!active){\n            localStorage.removeItem('auth_user');\n            if(window.__daStatusWatcher){window.__daStatusWatcher.off('value');window.__daStatusWatcher=null;}\n            currentUser=null;\n            document.getElementById('dashboard_section').classList.add('hidden');\n            document.getElementById('login_section').classList.remove('hidden');\n            resetLoginUI();\n            setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');\n            alert('এই DA ID Deactive করা হয়েছে। Login/নতুন Bill/Entry বন্ধ।');\n        }else{\n            localStorage.setItem('auth_user',JSON.stringify(currentUser));\n        }\n    });\n}\nfunction validateSavedDA(){\n    if(!currentUser || currentUser.role!=='user' || !currentUser.id)return;\n    database.ref('Users/'+currentUser.id).once('value',function(s){\n        if(!isUserActiveForLogin(s.val())){\n            localStorage.removeItem('auth_user');\n            currentUser=null;\n            document.getElementById('dashboard_section').classList.add('hidden');\n            document.getElementById('login_section').classList.remove('hidden');\n            resetLoginUI();\n            setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');\n        }else{\n            startDAStatusWatcher();\n            showDashboard();\n        }\n    });\n}\n'''

          if 'function isUserActiveForLogin' not in s:
              marker = '// ========== LOGIN =========='
              s = s.replace(marker, helper + '\n' + marker, 1)

          needle = "    var d=lookedUpUser.data;\n    \n    // শুধুমাত্র ইউজার লগইন করতে পারবে"
          if needle in s and 'if(!isUserActiveForLogin(d))' not in s:
              replacement = "    var d=lookedUpUser.data;\n    if(!isUserActiveForLogin(d)){setStatus('এই DA ID Deactive করা হয়েছে। Login বন্ধ।','err');document.getElementById('login_password').value='';alert('এই DA ID Deactive করা যাবে না। Login করা যাবে না।');return;}\n    \n    // শুধুমাত্র ইউজার লগইন করতে পারবে"
              s = s.replace(needle, replacement, 1)

          old_user = "currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null};"
          new_user = "currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null,active:true,status:'active'};"
          s = s.replace(old_user, new_user, 1)

          login_show = "localStorage.setItem('auth_user', JSON.stringify(currentUser));\n    showDashboard();"
          if login_show in s and 'startDAStatusWatcher();' not in s:
              s = s.replace(login_show, "localStorage.setItem('auth_user', JSON.stringify(currentUser));\n    startDAStatusWatcher();\n    showDashboard();", 1)

          submit_marker = 'function submitOrUpdateBill(statusType){'
          if submit_marker in s and 'function submitOrUpdateBill(statusType){\n    if(blockIfDeactivatedUser()) return;' not in s:
              s = s.replace(submit_marker, submit_marker + '\n    if(blockIfDeactivatedUser()) return;', 1)

          init = "if(currentUser.role === 'user') {\n                showDashboard();\n            } else {"
          if init in s and 'validateSavedDA();' not in s:
              s = s.replace(init, "if(currentUser.role === 'user') {\n                validateSavedDA();\n            } else {", 1)

          if s == old:
              raise SystemExit('No changes needed')
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "SPRGROUPBD"
          git config user.email "142073625+SPRGROUPBD@users.noreply.github.com"
          git add userbill.html
          git diff --cached --quiet && echo "No userbill changes" && exit 0
          git commit -m "Apply DA deactivation protection to userbill"
          git push
