name: Apply Monico One Advertisement Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Advertisement patch
        run: python3 scripts/patch_monico_advertisement.py

      - name: Commit patched Monico One
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monicoone.html
          git commit -m "Fix Monico One Advertisement with Appwrite" || echo "No changes to commit"
          git push

      - name: Remove temporary patch files
        run: |
          git rm -f scripts/patch_monico_advertisement.py .github/workflows/apply_monico_advertisement_fix.yml || true
          git commit -m "Remove temporary advertisement patch workflow" || echo "Nothing to remove"
          git push || true
