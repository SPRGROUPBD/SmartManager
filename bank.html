<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Deposit System</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dk:#0b2e3d;--md:#145369;--ac:#c8a415;--bg:#e8e3d9;--cd:#fff;--tx:#1a1a1a;--mt:#888;--bd:#cec8bb;--dg:#b52a1c;--ok:#0a7c3e;--wn:#d4820a}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);margin:14px;color:var(--tx);font-size:13px}
.ctn{max-width:880px;margin:auto;background:var(--cd);border:1px solid var(--bd);border-radius:8px;box-shadow:0 3px 16px rgba(0,0,0,.1);overflow:hidden}
.hdr{background:linear-gradient(135deg,var(--dk),var(--md));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.hdr .ic{width:40px;height:40px;background:rgba(255,255,255,.12);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:800}.hdr p{font-size:10px;opacity:.6;margin-top:1px}
.tabs{display:flex;border-bottom:2px solid var(--bd);background:#faf8f4}
.tb{flex:1;padding:10px 4px;border:none;background:0 0;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;position:relative;transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px}
.tb:hover{color:var(--tx);background:#f0ede5}
.tb.on{color:var(--dk);background:#fff}
.tb.on::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:var(--ac);border-radius:3px 3px 0 0}
.badge{background:var(--dg);color:#fff;font-size:8px;padding:1px 5px;border-radius:10px;font-weight:700;min-width:16px;text-align:center}
.tp{display:none;padding:16px}.tp.on{display:block}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fi{display:flex;flex-direction:column}.fi.fl{grid-column:1/-1}
.fi label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--mt);letter-spacing:.5px;margin-bottom:3px}
.fi input,.fi select{padding:7px 9px;border:1.5px solid var(--bd);border-radius:4px;font-size:12px;font-weight:600;color:var(--tx);background:#fff;transition:.2s}
.fi input:focus,.fi select:focus{outline:0;border-color:var(--md);box-shadow:0 0 0 3px rgba(20,83,105,.1)}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:12px}
.search-wrap input{width:100%;padding:8px 9px 8px 32px;border:1.5px solid var(--bd);border-radius:4px;font-size:12px;font-weight:600;color:var(--tx);background:#fff;transition:.2s}
.search-wrap input:focus{outline:0;border-color:var(--md);box-shadow:0 0 0 3px rgba(20,83,105,.1)}
.logo-row{display:flex;gap:10px;align-items:flex-end}.logo-row .fi{flex:1}
.logo-prev{width:40px;height:40px;border:1.5px dashed var(--bd);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f9f8f5;flex-shrink:0}
.logo-prev img{width:100%;height:100%;object-fit:contain}.logo-prev i{color:#ccc;font-size:14px}
.type-radio{display:flex;gap:12px;margin-bottom:10px}
.type-radio label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:600;padding:8px 16px;border:2px solid var(--bd);border-radius:5px;transition:.2s}
.type-radio input{display:none}
.type-radio label:has(input:checked).fr{border-color:var(--md);background:#e8f4f8;color:var(--md)}
.type-radio label:has(input:checked).to{border-color:var(--ok);background:#e8f8ee;color:var(--ok)}
.bt{padding:7px 14px;border:none;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.2s;text-transform:uppercase;letter-spacing:.2px}
.bt-ac{background:var(--ac);color:#fff}.bt-ac:hover{background:#b09212}
.bt-pr{background:var(--md);color:#fff}.bt-pr:hover{background:var(--dk)}
.bt-dg{background:var(--dg);color:#fff}.bt-dg:hover{background:#961f14}
.bt-ok{background:var(--ok);color:#fff;box-shadow:0 2px 6px rgba(10,124,62,.2)}.bt-ok:hover{background:#086633;transform:translateY(-1px)}
.bt-gh{background:0 0;color:var(--mt);border:1.5px solid var(--bd)}.bt-gh:hover{background:#f5f3ef;color:var(--tx)}
.bt-sm{padding:4px 7px;font-size:9px}
.bg{display:flex;gap:5px;flex-wrap:wrap}
.btl{width:100%;border-collapse:collapse;border:1px solid var(--bd);border-radius:5px;overflow:hidden;margin-top:8px}
.btl th{background:var(--dk);color:#fff;padding:7px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.3px;text-align:left}
.btl td{padding:6px 8px;border-bottom:1px solid #eee;font-size:11px;vertical-align:middle}
.btl tr:last-child td{border-bottom:0}.btl tr:hover{background:#faf8f4}
.bn{font-weight:700;color:var(--dk)}
.em{text-align:center;padding:22px;color:var(--mt);font-size:12px}
.em i{font-size:22px;display:block;margin-bottom:5px;opacity:.3}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.tag-fr{background:#e0eef5;color:var(--md)}.tag-to{background:#e0f5e8;color:var(--ok)}
.ac-box{background:#f7f5f0;border:1px solid var(--bd);border-radius:5px;padding:10px 12px;margin-bottom:10px;display:none}
.ac-box.sh{display:block}
.ac-box .ig{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.ac-box .ii label{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--mt);letter-spacing:.3px;display:block;margin-bottom:1px}
.ac-box .ii span{font-size:12px;font-weight:700;color:var(--tx)}
.dt{width:100%;border-collapse:collapse;border:1px solid var(--bd);border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dt th{background:linear-gradient(180deg,var(--dk),#091e29);color:#fff;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.dt th:first-child{text-align:left;padding-left:12px}
.dt td{padding:4px 5px;text-align:center;border-bottom:1px solid #eee;font-size:12px}
.dt td:first-child{text-align:left;padding-left:12px}
.dt tr:last-child td{border-bottom:0}.dt tr:hover{background:#faf8f4}
.db{display:inline-block;background:#eef2f7;border:1px solid #c8d0da;border-radius:3px;padding:2px 9px;font-weight:700;color:var(--md);font-size:12px}
input.qt{width:76px;text-align:center;padding:5px;border:2px solid var(--bd);border-radius:4px;font-size:13px;font-weight:600;background:#fefdfb;transition:.2s}
input.qt:focus{outline:0;border-color:var(--md);box-shadow:0 0 0 3px rgba(20,83,105,.1)}
.am{font-weight:700;min-width:75px}.am.on{color:var(--ok)}
.tb2{margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.tbx{background:linear-gradient(135deg,var(--dk),var(--md));color:#fff;padding:10px 20px;border-radius:7px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(11,46,61,.3)}
.tbx .tl2{font-size:10px;opacity:.75}.tbx .tv2{font-size:20px;font-weight:800}
.tbx .tv2 small{font-size:11px;opacity:.65;margin-right:1px}
.ft{text-align:center;padding:7px;font-size:9px;color:#aaa;border-top:1px solid #eee;background:#faf8f4}
.rpt-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.rpt-hd .fg2{margin-bottom:0;display:flex;gap:6px;align-items:flex-end}
.rpt-total{background:#f7f5f0;border:1px solid var(--bd);border-radius:5px;padding:8px 14px;text-align:right}
.rpt-total .rl{font-size:8px;text-transform:uppercase;color:var(--mt);font-weight:700}
.rpt-total .rv{font-size:18px;font-weight:800;color:var(--dk)}
.inst-inp{width:115px;padding:4px 5px;border:1.5px solid var(--bd);border-radius:3px;font-size:10px;font-weight:600;text-align:center}
.inst-inp:focus{outline:0;border-color:var(--ok);box-shadow:0 0 0 2px rgba(10,124,62,.12)}
.to-sel{padding:4px 5px;border:1.5px solid var(--bd);border-radius:3px;font-size:10px;font-weight:600;min-width:140px}
.to-sel:focus{outline:0;border-color:var(--ok);box-shadow:0 0 0 2px rgba(10,124,62,.12)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:center;justify-content:center}
.mo.sh{display:flex}
.mb{background:#fff;border-radius:7px;padding:18px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.mb h3{font-size:14px;margin-bottom:5px;color:var(--dk)}
.mb p{font-size:11px;color:#555;margin-bottom:12px;line-height:1.5}
.mb .bg{justify-content:flex-end}
.tt{position:fixed;top:16px;right:16px;padding:9px 14px;border-radius:5px;color:#fff;font-size:11px;font-weight:600;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:tI .3s ease;display:flex;align-items:center;gap:6px}
.tt.ok{background:var(--ok)}.tt.er{background:var(--dg)}.tt.wn{background:var(--wn)}
@keyframes tI{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes tO{from{opacity:1}to{opacity:0;transform:translateX(30px)}}
@media print{
body{background:#fff!important;margin:0!important;color:#000!important}
.tabs,.tp,.ft,.mo,.tt,.no-print,.rpt-hd,.rpt-total,.pz{display:none!important}
.ctn{max-width:100%!important;box-shadow:none!important;border:none!important;border-radius:0!important;background:#fff!important}
#sHdr{display:none!important}
#pzRpt{display:block!important;padding:0!important}
.rp-wrap{border:2px solid #000}
.rp-hdr2{padding:12px 14px;border-bottom:2px solid #000;text-align:center}
.rp-hdr2 h2{font-size:16px;font-weight:800;color:#000;letter-spacing:.5px}
.rp-hdr2 p{font-size:10px;color:#555;margin-top:2px}
.rp-tbl{width:100%;border-collapse:collapse}
.rp-tbl th{background:#fff!important;color:#000!important;border:1px solid #000!important;padding:6px 8px;font-size:9px;font-weight:700;text-transform:uppercase}
.rp-tbl td{border:1px solid #000!important;padding:5px 8px;font-size:11px;color:#000!important;background:#fff!important}
.rp-ft{padding:10px 14px;border-top:2px solid #000;text-align:right;font-size:14px;font-weight:800;color:#000}
}
.pz{display:none}
</style>
</head>
<body>

<div class="mo" id="delMo">
<div class="mb">
<h3><i class="fas fa-trash-alt" style="color:var(--dg);margin-right:4px"></i> মুছে ফেলতে চান?</h3>
<p id="delMs">এই তথ্য চিরতরে মুছে যাবে।</p>
<div class="bg">
<button class="bt bt-gh" onclick="clMo()">বাতিল</button>
<button class="bt bt-dg" onclick="doDel()"><i class="fas fa-trash"></i> মুছুন</button>
</div>
</div>
</div>

<div class="ctn">
<div class="hdr no-print" id="sHdr">
<div class="ic"><i class="fas fa-exchange-alt"></i></div>
<div><h1>Cash Deposit System</h1><p>From Bank → To Bank CRM Slip Generator</p></div>
</div>

<div class="tabs no-print">
<button class="tb on" onclick="goT('setup',0)"><i class="fas fa-piggy-bank"></i> Bank Setup</button>
<button class="tb" onclick="goT('entry',1)"><i class="fas fa-money-bill-wave"></i> Cash Entry</button>
<button class="tb" onclick="goT('pend',2)"><i class="fas fa-clock"></i> Pending <span class="badge" id="pnBg" style="display:none">0</span></button>
<button class="tb" onclick="goT('rpt',3)"><i class="fas fa-chart-bar"></i> Report</button>
</div>

<!-- Bank Setup -->
<div class="tp on" id="tpSetup">
<div class="type-radio">
<label class="fr"><input type="radio" name="bkType" value="from" checked><i class="fas fa-arrow-right"></i> From Bank</label>
<label class="to"><input type="radio" name="bkType" value="to"><i class="fas fa-bullseye"></i> To Bank</label>
</div>
<div class="fg">
<div class="fi fl"><label>Bank Name</label><input type="text" id="fBk" placeholder="e.g. Dutch-Bangla Bank"></div>
<div class="fi fl">
<label>Logo URL</label>
<div class="logo-row">
<div class="fi"><input type="text" id="fLogo" placeholder="https://example.com/logo.png" oninput="prevLogo()"></div>
<div class="logo-prev" id="logoPv"><i class="fas fa-image"></i></div>
</div>
</div>
<div class="fi"><label>Account Name</label><input type="text" id="fAc" placeholder="Account holder name"></div>
<div class="fi"><label>AC Number</label><input type="text" id="fAcN" placeholder="Account number"></div>
<div class="fi fl"><label>Branch</label><input type="text" id="fBr" placeholder="Branch name"></div>
</div>
<div class="bg">
<button class="bt bt-ac" id="svBt" onclick="svBank()"><i class="fas fa-plus"></i> Add Bank</button>
<button class="bt bt-gh" id="cnBt" onclick="cnEdit()" style="display:none"><i class="fas fa-times"></i> Cancel</button>
</div>
<div id="bkLs"><div class="em"><i class="fas fa-spinner fa-spin"></i>লোড হচ্ছে...</div></div>
</div>

<!-- Cash Entry -->
<div class="tp" id="tpEntry">
<div class="search-wrap">
<i class="fas fa-search"></i>
<input type="text" id="bkSearch" placeholder="Search bank name, AC no, account name..." oninput="fillFromDD()">
</div>
<div class="fi" style="margin-bottom:10px">
<label>From Bank (যেখান থেকে টাকা আসছে)</label>
<select id="fromSl" onchange="onFromSel()"><option value="">-- From Bank নির্বাচন --</option></select>
</div>
<div class="ac-box" id="acBox">
<div class="ig">
<div class="ii"><label>Bank Name</label><span id="dBk">-</span></div>
<div class="ii"><label>AC Number</label><span id="dAcN">-</span></div>
<div class="ii"><label>Account Name</label><span id="dAc">-</span></div>
<div class="ii"><label>Branch</label><span id="dBr">-</span></div>
</div>
</div>
<table class="dt">
<thead><tr><th>Denomination</th><th>Quantity</th><th>Total Amount</th></tr></thead>
<tbody id="dBd"></tbody>
</table>
<div class="tb2 no-print">
<div class="tbx"><div class="tl2">Grand Total</div><div class="tv2"><small>৳</small> <span id="gT">0</span></div></div>
<div class="bg">
<button class="bt bt-gh" onclick="rstQ()"><i class="fas fa-redo"></i> Reset</button>
<button class="bt bt-ok" onclick="svDep()"><i class="fas fa-save"></i> Save Deposit</button>
</div>
</div>
</div>

<!-- Pending -->
<div class="tp" id="tpPend">
<div id="pnLs"><div class="em"><i class="fas fa-spinner fa-spin"></i>লোড হচ্ছে...</div></div>
</div>

<!-- Report -->
<div class="tp" id="tpRpt">
<div class="rpt-hd no-print">
<div class="fg2">
<div class="fi"><label>Date</label><input type="date" id="rpDt" onchange="ldRpt()"></div>
<button class="bt bt-gh bt-sm" onclick="setToday()"><i class="fas fa-calendar-day"></i> Today</button>
<button class="bt bt-pr bt-sm" onclick="prRpt()"><i class="fas fa-print"></i> Print Report</button>
</div>
</div>
<div class="rpt-total" id="rpTot" style="display:none;margin-bottom:10px">
<div class="rl">Total Debit Amount</div>
<div class="rv"><small>৳</small> <span id="rpTv">0</span></div>
</div>
<div id="rpLs"><div class="em"><i class="fas fa-spinner fa-spin"></i>লোড হচ্ছে...</div></div>
</div>

<div class="pz" id="pzRpt"></div>
<div class="ft no-print">From Bank Cash Entry → Pending → To Bank + Instrument No → CRM Slip PDF</div>
</div>

<script>
firebase.initializeApp({
    apiKey:"AIzaSyDnRwKRvWqpWnLGvrg1UI1rWj0FIIRZa_o",
    authDomain:"bank-4f819.firebaseapp.com",
    databaseURL:"https://bank-4f819-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"bank-4f819",
    storageBucket:"bank-4f819.firebasestorage.app",
    messagingSenderId:"1073473515740",
    appId:"1:1073473515740:web:fd32c00b97524fb5074419",
    measurementId:"G-03B7NST388"
});
var rtdb=firebase.database(),bkRef=rtdb.ref("banks"),dpRef=rtdb.ref("deposits");
var banks=[],deps=[],editId=null,delType=null,delId=null,curTab='setup';
var denoms=[2,5,10,20,50,100,200,500,1000];

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmtD(d){if(!d)return"--";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0].slice(2)}
function today(){return new Date().toISOString().split("T")[0]}
function setToday(){document.getElementById("rpDt").value=today();ldRpt()}
function getBkType(){var r=document.querySelectorAll('input[name="bkType"]');for(var i=0;i<r.length;i++){if(r[i].checked)return r[i].value}return"from"}
function nowTime(){var n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")+":"+String(n.getSeconds()).padStart(2,"0")}

function toast(m,t){
    var o=document.querySelector(".tt");if(o)o.remove();
    var ic={ok:"check-circle",er:"times-circle",wn:"exclamation-triangle"};
    var e=document.createElement("div");e.className="tt "+(t||"ok");
    e.innerHTML='<i class="fas fa-'+(ic[t]||"info-circle")+'"></i> '+m;
    document.body.appendChild(e);
    setTimeout(function(){e.style.animation="tO .3s ease forwards";setTimeout(function(){e.remove()},300)},2500);
}

function opMo(type,id){
    delType=type;delId=id;
    var nm=type==='bank'?(banks.find(function(b){return b.id===id})||{}).bankName:'এই ডিপোজিট';
    document.getElementById("delMs").textContent='"'+nm+'" এর তথ্য মুছে যাবে।';
    document.getElementById("delMo").classList.add("sh");
}
function clMo(){delType=null;delId=null;document.getElementById("delMo").classList.remove("sh")}
function doDel(){
    if(!delId)return;
    var ref=delType==='bank'?bkRef.child(delId):dpRef.child(delId);
    ref.remove().then(function(){toast("মুছে ফেলা হয়েছে","ok");clMo()}).catch(function(e){toast(e.message,"er");clMo()});
}

function goT(t,i){
    curTab=t;var tabs=document.querySelectorAll(".tb");var panes=document.querySelectorAll(".tp");
    for(var j=0;j<tabs.length;j++){tabs[j].classList.toggle("on",j===i);panes[j].classList.toggle("on",j===i)}
    if(t==='entry'){document.getElementById("bkSearch").value="";fillFromDD()}
    if(t==='pend')ldPend();if(t==='rpt')ldRpt();
}

function prevLogo(){
    var u=document.getElementById("fLogo").value.trim();var pv=document.getElementById("logoPv");
    if(u){pv.innerHTML='<img src="'+esc(u)+'" onerror="this.parentElement.innerHTML=\'<i class=\\\'fas fa-image\\\'></i>\'">'}
    else{pv.innerHTML='<i class="fas fa-image"></i>'}
}

function svBank(){
    var tp=getBkType();
    var d={bankName:document.getElementById("fBk").value.trim(),logoUrl:document.getElementById("fLogo").value.trim(),
        acName:document.getElementById("fAc").value.trim(),acNo:document.getElementById("fAcN").value.trim(),
        branch:document.getElementById("fBr").value.trim(),bankType:tp,ts:Date.now()};
    if(!d.bankName||!d.acName||!d.acNo){toast("Bank Name, AC Name, AC Number দিন","wn");return}
    if(editId){
        bkRef.child(editId).update({bankName:d.bankName,logoUrl:d.logoUrl,acName:d.acName,acNo:d.acNo,branch:d.branch,bankType:tp})
        .then(function(){toast("আপডেট হয়েছে","ok");cnEdit()}).catch(function(e){toast(e.message,"er")});
    }else{
        bkRef.push(d).then(function(){toast((tp==='from'?"From":"To")+" Bank যোগ হয়েছে","ok");cnEdit()}).catch(function(e){toast(e.message,"er")});
    }
}

function cnEdit(){
    ["fBk","fLogo","fAc","fAcN","fBr"].forEach(function(id){document.getElementById(id).value=""});
    editId=null;document.querySelectorAll('input[name="bkType"]')[0].checked=true;
    document.getElementById("svBt").innerHTML='<i class="fas fa-plus"></i> Add Bank';
    document.getElementById("cnBt").style.display="none";document.getElementById("logoPv").innerHTML='<i class="fas fa-image"></i>';
}

function edBank(id){
    var b=banks.find(function(x){return x.id===id});if(!b)return;editId=id;
    document.getElementById("fBk").value=b.bankName;document.getElementById("fLogo").value=b.logoUrl||"";
    document.getElementById("fAc").value=b.acName;document.getElementById("fAcN").value=b.acNo;document.getElementById("fBr").value=b.branch||"";
    var radios=document.querySelectorAll('input[name="bkType"]');for(var i=0;i<radios.length;i++){radios[i].checked=radios[i].value===b.bankType}
    prevLogo();document.getElementById("svBt").innerHTML='<i class="fas fa-save"></i> Update Bank';
    document.getElementById("cnBt").style.display="inline-flex";document.getElementById("fBk").focus();window.scrollTo({top:0,behavior:"smooth"});
}

function bkLogoSm(u){
    if(!u)return '<i class="fas fa-university" style="color:#ccc"></i>';
    return '<img src="'+esc(u)+'" style="height:26px;width:auto;object-fit:contain" onerror="this.outerHTML=\'<i class=\\\'fas fa-university\\\' style=\\\'color:#ccc\\\'></i>\'">';
}

function rBanks(){
    var c=document.getElementById("bkLs");
    if(!banks.length){c.innerHTML='<div class="em"><i class="fas fa-piggy-bank"></i>কোনো ব্যাংক যোগ করা হয়নি</div>';return}
    var h='<table class="btl"><thead><tr><th style="width:36px"></th><th>Type</th><th>Bank</th><th>Account Name</th><th>AC No.</th><th>Branch</th><th style="width:90px">Actions</th></tr></thead><tbody>';
    banks.forEach(function(b){
        var tag=b.bankType==='from'?'<span class="tag tag-fr"><i class="fas fa-arrow-right"></i> From</span>':'<span class="tag tag-to"><i class="fas fa-bullseye"></i> To</span>';
        h+='<tr><td>'+bkLogoSm(b.logoUrl)+'</td><td>'+tag+'</td><td class="bn">'+esc(b.bankName)+'</td><td>'+esc(b.acName)+'</td><td>'+esc(b.acNo)+'</td><td>'+esc(b.branch||"—")+'</td>';
        h+='<td><div class="bg"><button class="bt bt-pr bt-sm" onclick="edBank(\''+b.id+'\')"><i class="fas fa-pen"></i></button><button class="bt bt-dg bt-sm" onclick="opMo(\'bank\',\''+b.id+'\')"><i class="fas fa-trash"></i></button></div></td></tr>';
    });
    h+='</tbody></table>';c.innerHTML=h;
}

bkRef.on("value",function(s){
    banks=[];if(s.exists())s.forEach(function(c){var o={id:c.key};var v=c.val();for(var k in v)o[k]=v[k];banks.push(o)});
    banks.reverse();rBanks();
});

/* ===== Cash Entry — Search + Dropdown ===== */
function fillFromDD(){
    var sl=document.getElementById("fromSl");var cv=sl.value;
    var q=(document.getElementById("bkSearch").value||"").toLowerCase().trim();
    sl.innerHTML='<option value="">-- From Bank নির্বাচন --</option>';
    banks.forEach(function(b){
        if(b.bankType!=='from')return;
        if(q){
            var txt=(b.bankName+" "+b.acName+" "+b.acNo+" "+b.branch).toLowerCase();
            if(txt.indexOf(q)===-1)return;
        }
        var o=document.createElement("option");o.value=b.id;
        o.textContent=b.bankName+" — "+b.acName+" ("+b.acNo+")";
        sl.appendChild(o);
    });
    if(cv&&sl.querySelector('option[value="'+cv+'"]')){sl.value=cv;onFromSel()}
}
function onFromSel(){
    var id=document.getElementById("fromSl").value;var bx=document.getElementById("acBox");
    if(!id){bx.classList.remove("sh");return}
    var b=banks.find(function(x){return x.id===id});if(!b)return;
    document.getElementById("dBk").textContent=b.bankName;document.getElementById("dAc").textContent=b.acName;
    document.getElementById("dAcN").textContent=b.acNo;document.getElementById("dBr").textContent=b.branch||"—";bx.classList.add("sh");
}

/* ===== Denomination ===== */
var dBd=document.getElementById("dBd");
denoms.forEach(function(v,i){
    var tr=document.createElement("tr");
    tr.innerHTML='<td><span class="db">৳ '+v.toLocaleString()+'</span></td><td><input type="number" class="qt" data-v="'+v+'" min="0" value="" oninput="calc()" onkeydown="nxt(event,'+i+')"></td><td class="am" id="a'+i+'">0</td>';
    dBd.appendChild(tr);
});
function calc(){
    var t=0;var inps=document.querySelectorAll(".qt");
    for(var i=0;i<inps.length;i++){var q=parseInt(inps[i].value)||0;var v=parseInt(inps[i].dataset.v);var s=q*v;var c=document.getElementById("a"+i);c.innerText="৳ "+s.toLocaleString();if(s>0)c.classList.add("on");else c.classList.remove("on");t+=s}
    document.getElementById("gT").innerText=t.toLocaleString();
}
function nxt(e,i){if(e.key==="Enter"){e.preventDefault();var inp=document.querySelectorAll(".qt");if(i<inp.length-1){inp[i+1].focus();inp[i+1].select()}}}
function rstQ(){var inps=document.querySelectorAll(".qt");for(var i=0;i<inps.length;i++)inps[i].value="";calc()}

/* ===== Save ===== */
function svDep(){
    var fid=document.getElementById("fromSl").value;var fb=banks.find(function(b){return b.id===fid});
    if(!fb){toast("From Bank নির্বাচন করুন","wn");return}
    var dn={};var tot=0;var inps=document.querySelectorAll(".qt");
    for(var i=0;i<inps.length;i++){var v=inps[i].dataset.v;var q=parseInt(inps[i].value)||0;dn[v]=q;tot+=q*parseInt(v)}
    if(tot===0){toast("কমপক্ষে একটি ডিনোমিনেশনে পরিমাণ দিন","wn");return}
    dpRef.push({
        fromBankId:fb.id,fromBankName:fb.bankName,fromLogoUrl:fb.logoUrl||"",
        fromAcName:fb.acName,fromAcNo:fb.acNo,fromBranch:fb.branch||"",
        toBankId:"",toBankName:"",toLogoUrl:"",toAcName:"",toAcNo:"",toBranch:"",
        denoms:dn,total:tot,instrumentNo:"",status:"pending",timeStr:nowTime(),
        date:today(),ts:Date.now()
    }).then(function(){toast("সেভ হয়েছে — Pending এ যাবে","ok");rstQ()}).catch(function(e){toast(e.message,"er")});
}

/* ===== Listen Deposits ===== */
dpRef.on("value",function(s){
    deps=[];if(s.exists())s.forEach(function(c){var o={id:c.key};var v=c.val();for(var k in v)o[k]=v[k];deps.push(o)});
    deps.sort(function(a,b){return(b.ts||0)-(a.ts||0)});updBadge();
    if(curTab==='pend')ldPend();if(curTab==='rpt')ldRpt();
});
function updBadge(){
    var pn=0;for(var i=0;i<deps.length;i++){if(deps[i].status==="pending")pn++}
    var bg=document.getElementById("pnBg");if(pn>0){bg.style.display="inline";bg.textContent=pn}else{bg.style.display="none"}
}

/* ===== Pending ===== */
function ldPend(){
    var c=document.getElementById("pnLs");var pn=[];for(var i=0;i<deps.length;i++){if(deps[i].status==="pending")pn.push(deps[i])}
    if(!pn.length){c.innerHTML='<div class="em"><i class="fas fa-check-circle"></i>কোনো Pending ডিপোজিট নেই</div>';return}
    var h='<div style="margin-bottom:6px;font-size:11px;color:var(--mt)">'+pn.length+'টি Pending — To Bank ও Instrument No. দিন</div>';
    h+='<table class="btl"><thead><tr><th>Date</th><th>From Bank</th><th>Debit</th><th>To Bank</th><th>Instrument No.</th><th style="width:90px">Actions</th></tr></thead><tbody>';
    pn.forEach(function(d){
        h+='<tr><td>'+fmtD(d.date)+'</td>';
        h+='<td><div class="bn">'+esc(d.fromBankName)+'</div><div style="font-size:9px;color:var(--mt)">'+esc(d.fromAcName)+' ('+esc(d.fromAcNo)+')</div></td>';
        h+='<td style="font-weight:700;color:var(--dg)">৳ '+d.total.toLocaleString()+'</td>';
        h+='<td><select class="to-sel" id="toSel_'+d.id+'"><option value="">-- To Bank --</option>';
        banks.forEach(function(b){if(b.bankType!=='to')return;h+='<option value="'+b.id+'" '+(d.toBankId===b.id?'selected':'')+'>'+esc(b.bankName)+' ('+esc(b.acNo)+')</option>'});
        h+='</select></td>';
        h+='<td><input type="text" class="inst-inp" id="inst_'+d.id+'" placeholder="Instrument No." value="'+esc(d.instrumentNo||'')+'"></td>';
        h+='<td><div class="bg"><button class="bt bt-ok bt-sm" onclick="submitPend(\''+d.id+'\')" title="Complete"><i class="fas fa-check"></i></button><button class="bt bt-dg bt-sm" onclick="opMo(\'dep\',\''+d.id+'\')" title="Delete"><i class="fas fa-trash"></i></button></div></td></tr>';
    });
    h+='</tbody></table>';c.innerHTML=h;
}

function submitPend(id){
    var toSel=document.getElementById("toSel_"+id);var instInp=document.getElementById("inst_"+id);
    var tid=toSel.value;var instNo=instInp.value.trim();
    if(!tid){toast("To Bank নির্বাচন করুন","wn");toSel.focus();return}
    if(!instNo){toast("Instrument No. দিন","wn");instInp.focus();return}
    var tb=banks.find(function(b){return b.id===tid});if(!tb)return;
    dpRef.child(id).update({
        toBankId:tb.id,toBankName:tb.bankName,toLogoUrl:tb.logoUrl||"",
        toAcName:tb.acName,toAcNo:tb.acNo,toBranch:tb.branch||"",
        instrumentNo:instNo,status:"completed",timeStr:nowTime()
    }).then(function(){toast("সম্পন্ন — Report এ দেখাবে","ok")}).catch(function(e){toast(e.message,"er")});
}

/* ===== Report ===== */
function ldRpt(){
    var dt=document.getElementById("rpDt").value;var list=[];
    for(var i=0;i<deps.length;i++){if(deps[i].status==="completed")list.push(deps[i])}
    if(dt){var f=[];for(var j=0;j<list.length;j++){if(list[j].date===dt)f.push(list[j])}list=f}
    list.sort(function(a,b){return(b.ts||0)-(a.ts||0)});
    var totEl=document.getElementById("rpTot");var c=document.getElementById("rpLs");
    if(!list.length){c.innerHTML='<div class="em"><i class="fas fa-chart-bar"></i>এই তারিখে কোনো রিপোর্ট নেই</div>';totEl.style.display="none";return}
    var grand=0;for(var k=0;k<list.length;k++)grand+=list[k].total;
    totEl.style.display="block";document.getElementById("rpTv").innerText=grand.toLocaleString();
    var h='<table class="btl"><thead><tr><th>Trans Date</th><th>From AC</th><th>To AC</th><th>Instrument No.</th><th style="text-align:right">Debit Amount</th><th style="width:80px">Actions</th></tr></thead><tbody>';
    list.forEach(function(d){
        h+='<tr><td>'+fmtD(d.date)+'</td>';
        h+='<td><div class="bn">'+esc(d.fromBankName)+'</div><div style="font-size:9px;color:var(--mt)">'+esc(d.fromAcNo)+' — '+esc(d.fromAcName)+'</div></td>';
        h+='<td><div class="bn" style="color:var(--ok)">'+esc(d.toBankName)+'</div><div style="font-size:9px;color:var(--mt)">'+esc(d.toAcNo)+' — '+esc(d.toAcName)+'</div></td>';
        h+='<td style="font-weight:700;color:var(--md)">'+esc(d.instrumentNo)+'</td>';
        h+='<td style="text-align:right;font-weight:700;color:var(--dg)">৳ '+d.total.toLocaleString()+'</td>';
        h+='<td><div class="bg"><button class="bt bt-ac bt-sm" onclick="dlCrm(\''+d.id+'\')" title="CRM Slip"><i class="fas fa-receipt"></i> CRM</button><button class="bt bt-dg bt-sm" onclick="opMo(\'dep\',\''+d.id+'\')"><i class="fas fa-trash"></i></button></div></td></tr>';
    });
    h+='</tbody></table>';c.innerHTML=h;
}

/* ===== Print Report ===== */
function prRpt(){
    var dt=document.getElementById("rpDt").value;var list=[];
    for(var i=0;i<deps.length;i++){if(deps[i].status==="completed")list.push(deps[i])}
    if(dt){var f=[];for(var j=0;j<list.length;j++){if(list[j].date===dt)f.push(list[j])}list=f}
    list.sort(function(a,b){return(b.ts||0)-(a.ts||0)});
    if(!list.length){toast("রিপোর্টে কোনো ডাটা নেই","wn");return}
    var grand=0;for(var k=0;k<list.length;k++)grand+=list[k].total;
    var rows='';list.forEach(function(d){
        rows+='<tr><td>'+fmtD(d.date)+'</td><td>'+esc(d.fromBankName)+'<br><small>'+esc(d.fromAcNo)+' — '+esc(d.fromAcName)+'</small></td><td>'+esc(d.toBankName)+'<br><small>'+esc(d.toAcNo)+' — '+esc(d.toAcName)+'</small></td><td style="font-weight:700">'+esc(d.instrumentNo)+'</td><td style="text-align:right;font-weight:700">৳ '+d.total.toLocaleString()+'</td></tr>';
    });
    document.getElementById("pzRpt").innerHTML='<div class="rp-wrap"><div class="rp-hdr2"><h2>CASH DEPOSIT REPORT</h2><p>'+(dt?'Date: '+fmtD(dt):'All Dates')+'</p></div><table class="rp-tbl"><thead><tr><th>Trans Date</th><th>From AC</th><th>To AC</th><th>Instrument No.</th><th style="text-align:right">Debit Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="rp-ft">Total Debit: ৳ '+grand.toLocaleString()+'</div></div>';
    window.print();
}

/* ==========================================================
   CRM SLIP — ঠিক DBBL থার্মাল রিসিপ্ট ফরম্যাট
   Left-Right দুই কলাম লেআউট
   ========================================================== */
function crmHTML(d){
    var logo=d.toLogoUrl
        ? '<img src="'+esc(d.toLogoUrl)+'" style="height:50px;width:auto;object-fit:contain" onerror="this.style.display=\'none\'">'
        : '';
    var logoFb=logo?'':'<div style="width:50px;height:50px;border:2px solid #000;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px"><i class="fas fa-university"></i></div>';

    /* ডিনোমিনেশন রো */
    var dnRows='';var keys=Object.keys(d.denoms);var hasDenom=false;
    for(var i=0;i<keys.length;i++){
        var v=keys[i];var q=d.denoms[v];
        if(q>0){hasDenom=true;dnRows+='<tr><td style="padding:2px 0;font-size:11px">৳ '+parseInt(v).toLocaleString()+'</td><td style="padding:2px 0;font-size:11px;text-align:center">x '+q+'</td><td style="padding:2px 0;font-size:11px;text-align:right;font-weight:700">৳ '+(q*parseInt(v)).toLocaleString()+'</td></tr>'}
    }

    /* Left-Right রো জেনারেটর — ঠিক DBBL ফরম্যাট */
    function lrRow(lL,lV,rL,rV){
        return '<tr>'
            +'<td style="padding:2px 0;font-size:11px;font-weight:700;white-space:nowrap">'+esc(lL)+'</td>'
            +'<td style="padding:2px 0;font-size:11px">'+esc(lV)+'</td>'
            +'<td style="padding:2px 6px;font-size:11px;text-align:center">-</td>'
            +'<td style="padding:2px 0;font-size:11px;font-weight:700;white-space:nowrap">'+esc(rL)+'</td>'
            +'<td style="padding:2px 0;font-size:11px">'+esc(rV)+'</td>'
            +'</tr>';
    }

    return '<div style="max-width:320px;margin:0 auto;font-family:Courier New,Courier,monospace;color:#000;padding:14px 10px;background:#fff">'

    /* লোগো + ব্যাংক নাম */
    +'<div style="text-align:center;margin-bottom:6px">'
    +(logo||logoFb)
    +'<div style="font-size:14px;font-weight:900;letter-spacing:.5px;margin-top:4px;text-transform:uppercase">'+esc(d.toBankName)+'</div>'
    +'</div>'

    /* ড্যাশড */
    +'<div style="border-top:2px dashed #000;margin-bottom:6px"></div>'

    /* CASH DEPOSIT */
    +'<div style="text-align:center;font-size:15px;font-weight:900;letter-spacing:2px;margin-bottom:6px">CASH DEPOSIT</div>'

    /* ড্যাশড */
    +'<div style="border-top:1px dashed #000;margin-bottom:6px"></div>'

    /* Date / Time — Left-Right */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:4px">'
    +'<tr>'
    +'<td style="padding:2px 0;font-size:11px;font-weight:700">Date:</td>'
    +'<td style="padding:2px 0;font-size:11px">'+fmtD(d.date)+'</td>'
    +'<td style="padding:2px 6px;font-size:11px;text-align:center">-</td>'
    +'<td style="padding:2px 0;font-size:11px;font-weight:700">Time:</td>'
    +'<td style="padding:2px 0;font-size:11px">'+(d.timeStr||'--:--:--')+'</td>'
    +'</tr></table>'

    /* Instrument No */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:2px">'
    +'<tr><td style="padding:2px 0;font-size:11px;font-weight:700">Instrument No:</td><td style="padding:2px 0;font-size:11px;font-weight:700">'+esc(d.instrumentNo||"—")+'</td></tr>'
    +'</table>'

    /* ড্যাশড */
    +'<div style="border-top:1px dashed #000;margin:4px 0"></div>'

    /* Name - Account : Left-Right */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:2px">'
    +lrRow('Name:', d.fromAcName||"—", 'Account:', d.toAcName||"—")
    +'</table>'

    /* From - AC : Left-Right */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:2px">'
    +lrRow('From:', d.fromBankName+' ('+d.fromAcNo+')', 'AC:', d.toAcNo||"—")
    +'</table>'

    /* ড্যাশড */
    +'<div style="border-top:1px dashed #000;margin:6px 0"></div>'

    /* ডিনোমিনেশন */
    +(hasDenom
        ?'<div style="margin-bottom:4px"><table style="width:100%;border-collapse:collapse">'
        +'<tr style="border-bottom:1px solid #000"><td style="padding:2px 0;font-size:10px;font-weight:700">DENOMINATION</td><td style="padding:2px 0;font-size:10px;font-weight:700;text-align:center">QTY</td><td style="padding:2px 0;font-size:10px;font-weight:700;text-align:right">AMOUNT</td></tr>'
        +dnRows+'</table></div><div style="border-top:1px dashed #000;margin:4px 0"></div>'
        :'')

    /* AMOUNT */
    +'<div style="text-align:center;margin:8px 0">'
    +'<div style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:2px">AMOUNT</div>'
    +'<div style="font-size:26px;font-weight:900;letter-spacing:1px">BDT '+d.total.toLocaleString()+'.00</div>'
    +'</div>'

    /* ড্যাশড */
    +'<div style="border-top:2px dashed #000;margin:6px 0"></div>'

    /* Footer */
    +'<div style="text-align:center;font-size:9px;color:#555;line-height:1.6">'
    +'*** This is a computer generated receipt ***<br>'
    +'Powered by Cash Deposit'
    +'</div>'

    +'</div>';
}

function dlCrm(id){
    var d=deps.find(function(x){return x.id===id});if(!d)return;
    var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CRM - '+esc(d.toBankName)+'</title>'
    +'<style>@page{margin:6mm;size:80mm auto}body{margin:0;padding:0}</style></head><body>'
    +crmHTML(d)
    +'<script>window.onload=function(){window.print()}<\/script></body></html>';
    var w=window.open("","_blank","width=400,height:700");
    w.document.write(html);w.document.close();
}
</script>
</body>
</html>
