name: Fix userbill login
on:
  push:
    paths:
      - '.github/workflows/fix-userbill-login.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript login syntax and watcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('userbill.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('\\nfunction isUserActiveForLogin', 'function isUserActiveForLogin')
          s=s.replace('\\nfunction blockIfDeactivatedUser', 'function blockIfDeactivatedUser')
          s=s.replace('\\nfunction startDAStatusWatcher', 'function startDAStatusWatcher')
          s=s.replace('\\nfunction validateSavedDA', 'function validateSavedDA')
          s=s.replace('\\n// ========== LOGIN ==========', '// ========== LOGIN ==========')
          old="currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null,active:true,status:'active'};\n    localStorage.setItem('auth_user', JSON.stringify(currentUser));\n    showDashboard();"
          new="currentUser={name:d.name,role:d.role||'user',depot:d.depot,id:lookedUpUser.key,photoUrl:d.photoUrl||null,active:true,status:'active'};\n    localStorage.setItem('auth_user', JSON.stringify(currentUser));\n    startDAStatusWatcher();\n    showDashboard();"
          if old not in s:
              raise SystemExit('login block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-userbill-login.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userbill.html .github/workflows/fix-userbill-login.yml
          git commit -m 'Fix DA login JavaScript syntax and active status watcher'
          git push
