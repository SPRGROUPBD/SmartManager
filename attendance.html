<style>

.login-card{background:rgba(21,31,48,.85);backdrop-filter:blur(20px);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:420px;max-width:92vw;position:relative;z-index:1;box-shadow:0 25px 60px rgba(0,0,0,.5)}

.toast{padding:14px 20px;border-radius:12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastIn .4s ease;min-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.3)}

.stagger>*:nth-child(1){animation-delay:.05s}
.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.15s}
.stagger>*:nth-child(4){animation-delay:.2s}
.stagger>*:nth-child(5){animation-delay:.25s}
.stagger>*:nth-child(6){animation-delay:.3s}
@media(max-width:768px){

.pdf-loading .spinner{width:48px;height:48px;border:4px solid rgba(0,212,170,.2);border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rpt-table{width:100%;border-collapse:collapse}

.tour-cam{background:rgba(59,130,246,.06);border:1px dashed rgba(59,130,246,.3);border-radius:12px;padding:16px;margin-top:12px}
</style>

<script>
var DIC_ID='KUS-11182401',DIC_PASS='KUS-11182401';
var DB_URL='https://attendance-kushtia-default-rtdb.europe-west1.firebasedatabase.app';
var firebaseConfig={apiKey:"AIzaSyBEg0R0YOOsFgKiyTv3QkyQv0Vhpym1lms",authDomain:"attendance-kushtia.firebaseapp.com",databaseURL:DB_URL,projectId:"attendance-kushtia",storageBucket:"attendance-kushtia.firebasestorage.app",messagingSenderId:"695383066612",appId:"1:695383066612:web:0d9f5a6dc5d1bbd0a6dba1",measurementId:"G-G21R0GPT2X"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();

var currentUser=null,allUsers={},allHolidays={},currentTab='overview',selectedStatus='',dicEntryStatus='',tourImageData=null;
var imgCache={};
var DESIG_ORDER=['Depot In-Charge','Asst. Depot In-Charge','Delivery Assistant'];
var DESIGNATIONS=DESIG_ORDER;

function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function firstDayOfMonth(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function formatBD(ds){if(!ds)return'';var d=new Date(ds+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function statusLabel(s){return{P:'Present',A:'Absent',T:'Tour',L:'Leave',H:'Holiday'}[s]||s}
function statusColor(s){return{P:'#008866',A:'#cc3333',T:'#3366cc',L:'#cc8800',H:'#8844cc'}[s]||'#666'}
function monthName(m){return['January','February','March','April','May','June','July','August','September','October','November','December'][m]}
function monthShort(m){return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]}
function isFriday(ds){var d=new Date(ds+'T00:00:00');return d.getDay()===5}
function isHoliday(ds){return allHolidays.hasOwnProperty(ds)||isFriday(ds)}
function getHolidayName(ds){if(allHolidays.hasOwnProperty(ds))return allHolidays[ds];if(isFriday(ds))return'Weekly Holiday (Friday)';return''}
function getAttStatus(ds,uid,att){if(att&&att.status)return att.status;if(isHoliday(ds))return'H';return''}
function desigOrder(d){var i=DESIG_ORDER.indexOf(d);return i===-1?99:i}
function getRoleFromDesig(d){if(d==='Depot In-Charge')return'DIC';if(d==='Asst. Depot In-Charge')return'ADIC';return'DA'}
function roleBadge(r){if(r==='DIC')return'<span class="role-badge-dic">Admin</span>';if(r==='ADIC')return'<span class="role-badge-adic">ADIC</span>';return'<span class="role-badge-da">DA</span>'}
function dateRange(fromStr,toStr){var dates=[];var cur=new Date(fromStr+'T00:00:00'),end=new Date(toStr+'T00:00:00');while(cur<=end){dates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));cur.setDate(cur.getDate()+1)}return dates}

/* ===== লোকেশন ক্যাপচার + নাম (Nominatim Reverse Geocoding) ===== */
function captureLocation(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){resolve(null);return}
    navigator.geolocation.getCurrentPosition(
      function(pos){
        var loc={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),name:''};
        fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+loc.lat+'&lon='+loc.lng+'&zoom=18&addressdetails=1',{headers:{'Accept-Language':'bn,en'}})
        .then(function(r){return r.json()})
        .then(function(data){if(data&&data.display_name)loc.name=data.display_name;resolve(loc)})
        .catch(function(){resolve(loc)});
      },
      function(){resolve(null)},{timeout:10000,enableHighAccuracy:true}
    );
  });
}
function locHTML(loc){
  if(!loc||!loc.lat)return'<span style="color:var(--muted);font-size:11px">--</span>';
  var nm=loc.name?'<div style="font-size:9px;color:var(--text2);margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+loc.name.replace(/"/g,'&quot;')+'"><i class="fa-solid fa-map-pin" style="margin-right:2px;color:var(--accent)"></i>'+loc.name.substring(0,60)+'</div>':'';
  return'<a href="https://www.google.com/maps?q='+loc.lat+','+loc.lng+'" target="_blank" class="loc-link" title="Accuracy: ~'+loc.acc+'m"><i class="fa-solid fa-location-dot"></i>'+loc.lat.toFixed(4)+', '+loc.lng.toFixed(4)+'</a>'+nm;
}
function imgBtn(key){if(!imgCache[key])return'';return' <button class="btn btn-xs btn-secondary" onclick="viewImage(\''+key+'\')" style="padding:3px 6px;margin-left:2px" title="View Tour Photo"><i class="fa-solid fa-image" style="font-size:10px;color:#60a5fa"></i></button>'}
function viewImage(key){var img=imgCache[key];if(!img){showToast('Image not available','error');return}var ov=document.getElementById('modalOverlay');ov.style.display='flex';ov.innerHTML='<div class="modal-box" style="max-width:700px"><h3 style="font-size:18px;font-weight:700;margin-bottom:16px"><i class="fa-solid fa-image" style="color:var(--accent);margin-right:8px"></i>Tour Photo</h3><div style="text-align:center"><img src="'+img+'" style="max-width:100%;max-height:500px;border-radius:12px"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div>';ov.onclick=function(e){if(e.target===ov)closeModal()}}

/* ===== ইমেজ কম্প্রেস ===== */
function compressImage(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){

async function renderHolidays(){await loadHolidays();var now=new Date(),cm=now.getMonth(),cy=now.getFullYear(),cd=getDaysInMonth(cy,cm);var fridayList='';for(var d=1;d<=cd;d++){var ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(isFriday(ds))fridayList+='<span class="pending-badge" style="margin:2px">'+d+' ('+new Date(ds+'T00:00:00').toLocaleDateString('en',{weekday:'short'})+')</span> '}var sorted=Object.entries(allHolidays).sort(function(a,b){return a[0].localeCompare(b[0])}),listHTML='';if(sorted.length===0){listHTML='<div style="text-align:center;padding:30px;color:var(--muted)">No custom holidays added yet</div>'}else{var rh='';for(var i=0;i<sorted.length;i++){var dd=sorted[i][0],n=sorted[i][1],dayName=new Date(dd+'T00:00:00').toLocaleDateString('en',{weekday:'long'});rh+='<tr><td style="font-weight:600">'+formatBD(dd)+'</td><td style="color:var(--text2);font-size:12px">'+dayName+'</td><td><span class="holiday-badge">'+n+'</span></td><td><button class="btn btn-xs btn-danger" onclick="removeHoliday(\''+dd+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>'}listHTML='<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Date</th><th>Day</th><th>Holiday</th><th>Action</th></tr></thead><tbody>'+rh+'</tbody></table></div>'}document.getElementById('dicContent').innerHTML='<div class="fade-in"><h2 style="font-size:22px;font-weight:800;margin-bottom:20px">Manage Holidays</h2><div class="card" style="margin-bottom:20px;border-color:rgba(245,158,11,.2)"><h3 style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--warn)"><i class="fa-solid fa-calendar-week" style="margin-right:8px"></i>Weekly Holiday (Auto)</h3><p style="font-size:13px;color:var(--text2);margin-bottom:10px">Every <strong style="color:var(--warn)">Friday</strong> is automatically marked as weekly holiday. No need to add manually.</p><div style="display:flex;flex-wrap:wrap;gap:4px">'+fridayList+'</div></div><div class="card" style="margin-bottom:20px"><h3 style="font-size:16px;font-weight:700;margin-bottom:16px"><i class="fa-solid fa-plus-circle" style="color:var(--accent);margin-right:8px"></i>Add Custom Holiday</h3><div style="display:flex;gap:14px;align-items:end;flex-wrap:wrap"><div class="form-group" style="margin:0;min-width:180px"><label class="form-label">Date</label><input type="date" class="form-input" id="holDate"></div><div class="form-group" style="margin:0;min-width:250px"><label class="form-label">Holiday Name</label><input class="form-input" id="holName" placeholder="e.g. Independence Day"></div><button class="btn btn-primary" onclick="addHoliday()"><i class="fa-solid fa-plus"></i> Add</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px"><h3 style="font-size:16px;font-weight:700">Custom Holiday List ('+sorted.length+')</h3><button class="btn btn-sm btn-danger" onclick="clearAllHolidays()"'+(sorted.length===0?' disabled':'')+'><i class="fa-solid fa-trash"></i> Clear All</button></div>'+listHTML+'</div></div>'}
async function addHoliday(){var date=document.getElementById('holDate').value,name=document.getElementById('holName').value.trim();if(!date||!name){showToast('Date and name required','error');return}if(isFriday(date)){showToast('This date is already a Friday (auto holiday)','info');return}if(allHolidays[date]){showToast('This date already has a holiday entry','error');return}await db.ref('holidays/'+date).set(name);allHolidays[date]=name;showToast('Holiday added','success');renderHolidays()}
async function removeHoliday(date){showModal('Remove Holiday','<p style="color:var(--text2)">Remove holiday on <strong>'+formatBD(date)+'</strong>?</p>',async function(){await db.ref('holidays/'+date).remove();delete allHolidays[date];showToast('Removed','info');renderHolidays()})}
function clearAllHolidays(){showModal('Clear All','<p style="color:var(--text2)">Remove ALL custom holidays?</p><p style="color:var(--warn);font-size:12px;margin-top:8px">Fridays will still remain as weekly holiday.</p>',async function(){await db.ref('holidays').remove();allHolidays={};showToast('Cleared','info');renderHolidays()})}
